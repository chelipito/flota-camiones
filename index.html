<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Control de Flota · Demostración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --primario:#111111; --acento:#FFC20E; --sobre-acento:#111111; --acento-suave:#FFF4CC; --foco:#2563EB;
  --fondo:#F1F5F9; --tarjeta:#FFFFFF; --texto:#0F172A; --texto-2:#475569; --borde:#CBD5E1;
  --wsp:#128C7E;
  --ok-f:#DCFCE7; --ok-t:#166534;
  --pv-f:#FFEDD5; --pv-t:#9A3412;
  --ur-f:#FEE2E2; --ur-t:#991B1B;
  --sr-f:#E2E8F0; --sr-t:#334155;
  --radio:12px;
  --top-bg:#111111; --top-fg:#FFFFFF; --top-btn:rgba(255,255,255,.12);
  --ancho-menu:260px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:"Source Sans 3",system-ui,sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3{font-family:Lexend,system-ui,sans-serif;line-height:1.25;margin:0 0 .5rem}
h1{font-size:1.5rem} h2{font-size:1.15rem} h3{font-size:1.05rem}
p{margin:0 0 .75rem}
a{color:var(--primario)}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
[tabindex="-1"]:focus{outline:none} /* títulos que reciben el foco al cambiar de pantalla: sin borde */
.num{font-family:Lexend,sans-serif;font-variant-numeric:tabular-nums}
.ico{width:1.25em;height:1.25em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Menú lateral (solo dueño) */
.side{position:fixed;top:0;bottom:0;left:0;width:var(--ancho-menu);background:#111;color:#E5E7EB;display:flex;flex-direction:column;z-index:40;transform:translateX(-100%);overflow-y:auto}
body:not(.con-side) .side{display:none}
body.menu-abierto .side{transform:none}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
body.menu-abierto .scrim{display:block}
.side .logo-side{font-family:Lexend;font-weight:700;letter-spacing:.14em;padding:22px 20px;font-size:1.05rem;color:#fff;text-decoration:none;border-bottom:1px solid #262626;display:block}
.side .logo-side span{color:var(--acento)}
.side .grupo{font-size:.75rem;letter-spacing:.12em;color:#9CA3AF;padding:18px 20px 6px;font-weight:700}
.side a.item-menu{display:flex;align-items:center;gap:.7rem;margin:2px 10px;padding:.6rem .75rem;border-radius:8px;color:#D1D5DB;text-decoration:none;font-weight:600;min-height:44px}
.side a.item-menu:hover{background:#1F1F1F;color:#fff}
.side a.item-menu[aria-current="page"]{background:#262626;color:#fff;box-shadow:inset 3px 0 0 var(--acento)}
.side a.item-menu[aria-current="page"] .ico{color:var(--acento)}
.side .abajo{margin-top:auto;border-top:1px solid #262626;padding:8px 0 12px}
.side .badge{margin-left:auto}
@media (prefers-reduced-motion:no-preference){.side{transition:transform .2s ease-out}}
@media (min-width:900px){
  body.con-side .side{transform:none}
  body.con-side .contenido{margin-left:var(--ancho-menu)}
  body.con-side .btn-menu{display:none}
  body.con-side .scrim{display:none !important}
  body.con-side{--top-bg:#FFFFFF;--top-fg:#111111;--top-btn:rgba(0,0,0,.06)}
  body.con-side .top{border-bottom:1px solid var(--borde)}
  body.con-side .top .marca{display:none}
  body.con-side .migas{display:flex}
  body.con-side .top .avatar{display:grid}
}

/* Barra superior */
.top{position:sticky;top:0;z-index:30;background:var(--top-bg);color:var(--top-fg);padding:.5rem 16px;display:flex;align-items:center;gap:.5rem;min-height:60px}
body:not(.con-side) .top{border-bottom:4px solid var(--acento)}
.top .marca{display:flex;align-items:center;gap:.5rem;font-family:Lexend;font-weight:700;font-size:1.05rem;color:inherit;text-decoration:none;margin-right:auto;min-width:0}
.top .logo{color:var(--acento);width:1.6em;height:1.6em}
.migas{display:none;align-items:center;gap:.5rem;font-size:.85rem;font-weight:600;margin-right:auto}
.migas .seccion-marca{font-weight:700;letter-spacing:.12em;background:var(--acento);color:#111;padding:.1rem .45rem;border-radius:4px}
.top .volver{display:inline-flex;align-items:center;gap:.3rem;min-height:44px;padding:0 .7rem 0 .4rem;border:0;border-radius:8px;background:var(--top-btn);color:inherit;font-weight:600;cursor:pointer}
.top .volver .ico{width:1.4em;height:1.4em}
.top .btn-ico{width:44px;height:44px;border:0;background:transparent;color:inherit;display:grid;place-items:center;border-radius:8px;position:relative;cursor:pointer;flex:none}
.top .btn-ico .ico{width:24px;height:24px}
.top .contador{position:absolute;top:3px;right:1px;background:#DC2626;color:#fff;font-size:.7rem;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;line-height:1}
.top .avatar{display:none}
.top .avatar .ico{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;padding:.2rem .65rem;font-size:.85rem;font-weight:600;white-space:nowrap}
.top .pill{background:var(--top-btn);color:inherit}
.top .pill.off{background:#FDE68A;color:#78350F}
@media (max-width:400px){.top .pill:not(.off) .pill-txt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
@media (max-width:480px){.top .volver:not([hidden]) ~ .marca .marca-txt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
.demo-banda{background:var(--acento);color:var(--sobre-acento);text-align:center;font-size:.85rem;padding:.3rem 16px;font-weight:600}
body.con-side .demo-banda{background:var(--acento-suave)}
.demo-banda:not(.alerta):not(.local){display:none}
.demo-banda.alerta{background:#FEF3C7;color:#78350F}

main{max-width:1120px;margin:0 auto;padding:20px 16px 48px}
.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:var(--radio);padding:16px;margin-bottom:12px}
.fila{display:flex;align-items:center;gap:.75rem}
.entre{justify-content:space-between}
.sec{color:var(--texto-2);font-size:.95rem}
.grid{display:grid;gap:12px}
@media (min-width:720px){.grid-2{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:repeat(3,1fr)}}
.grid-inicio{display:grid;gap:16px;align-items:start}
@media (min-width:960px){.grid-inicio{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}}
.cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.cab h1{margin:0}
.fecha-larga{color:var(--texto-2);font-size:.9rem;margin-bottom:.2rem}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:48px;padding:.6rem 1.1rem;border-radius:10px;border:2px solid var(--primario);background:#fff;color:var(--primario);font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn.pri{background:var(--primario);color:#fff}
.btn.cta{background:var(--acento);border-color:var(--primario);color:var(--sobre-acento)}
.btn.wsp{background:#fff;border-color:var(--borde);color:var(--texto)}
.btn.wsp .ico{color:var(--wsp)}
.btn.peligro{border-color:var(--ur-t);color:var(--ur-t)}
.btn.grande{min-height:60px;font-size:1.15rem;width:100%}
.btn.chico{min-height:40px;padding:.35rem .8rem;font-size:.95rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.txt{border-color:transparent;background:transparent;padding-left:.25rem;padding-right:.25rem}
.acciones{display:flex;flex-wrap:wrap;gap:10px}

/* Semáforo y chips */
.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:8px;padding:.2rem .6rem;font-weight:600;font-size:.9rem;white-space:nowrap}
.chip{background:#F1F5F9;color:#334155}
.chip.ok .ico{color:var(--ok-t)}
.chip.porvencer .ico{color:#C2410C}
.chip.urgente .ico,.chip.vencido .ico{color:#B91C1C}
.chip.sinreporte .ico{color:#64748B}
.chip.urgente,.chip.vencido{color:#7F1D1D}
.chip.arrendado,.chip.disponible,.chip.rol{background:#F1F5F9;color:#111}
.chip.disponible{background:#fff;box-shadow:inset 0 0 0 1px var(--borde)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (min-width:720px){.kpis{gap:12px}}
@media (max-width:719px){
  .kpis{gap:6px}
  .kpi{padding:10px 3px;border-radius:10px;text-align:center}
  .kpi .n{font-size:1.4rem}
  .kpi .l{display:block;font-size:.72rem;font-weight:400;line-height:1.2;margin-top:.3rem}
  .kpi .l .ico{display:none}
  .kpi.urgente .n{color:#B91C1C} .kpi.porvencer .n{color:#C2410C} .kpi.ok .n{color:var(--ok-t)}
  .top .marca-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
.kpi{border-radius:var(--radio);padding:14px;border:1px solid var(--borde);background:#fff;text-align:left;display:block;width:100%;color:inherit;text-decoration:none}
a.kpi{cursor:pointer}
.kpi.activo{border-color:#111;box-shadow:inset 0 0 0 1px #111}
.kpi .n{font-family:Lexend;font-size:2rem;font-weight:700;line-height:1}
.kpi .l{display:flex;align-items:center;gap:.35rem;font-weight:600;margin-top:.35rem}
.kpi .l{color:var(--texto-2)}
.kpi.ok .ico{color:var(--ok-t)} .kpi.porvencer .ico{color:#C2410C}
.kpi.urgente .ico{color:#B91C1C} .kpi.sinreporte .ico{color:#64748B}

/* Listas */
.item{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}
.item .cuerpo{flex:1;min-width:0}
.patente{font-family:Lexend;font-weight:700;font-size:1.2rem;letter-spacing:.04em;text-decoration:none;color:inherit}
.aviso-fila{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--borde);color:inherit;text-decoration:none}
.aviso-fila:first-child{border-top:0}
.aviso-fila .cuerpo{flex:1;min-width:0;display:flex;flex-direction:column}
.tipo{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--texto-2)}
.chip-ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.chip-ico{background:#F1F5F9;color:#64748B}
.chip-ico.ok{color:var(--ok-t)} .chip-ico.porvencer{color:#C2410C} .chip-ico.urgente,.chip-ico.vencido{color:#B91C1C}
.dl{display:grid;grid-template-columns:auto 1fr;gap:.3rem 1rem;margin:0 0 .5rem}
.dl dt{color:var(--texto-2)} .dl dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.persona{display:flex;gap:12px;align-items:flex-start}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--acento);color:#111;display:grid;place-items:center;font-family:Lexend;font-weight:700;font-size:.9rem;flex:none}
.titulo-tarjeta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:.5rem}
.titulo-tarjeta h2{margin:0}
.ver-todo{font-weight:600;text-decoration:none;white-space:nowrap}

/* Barras */
.barra{height:14px;border-radius:7px;background:#E2E8F0;overflow:hidden;margin:.4rem 0}
.barra{height:8px;background:#E2E8F0}
.barra > span{display:block;height:100%;background:#64748B}
.barra.urgente > span,.barra.vencido > span{background:#B91C1C}
.barra.porvencer > span{background:#C2410C}
/* Inicio: estado general arriba y bloques de mantenciones, vencimientos y registros */
.estado-hero{display:flex;flex-direction:column;gap:10px}
.estado-hero .chip-ico{width:48px;height:48px;border-radius:14px}
.estado-hero .chip-ico .ico{width:26px;height:26px}
.estado-hero .grande{font-family:Lexend;font-weight:700;font-size:1.45rem;line-height:1.2;display:block}
.fila-inicio{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--borde);color:inherit;text-decoration:none}
.fila-inicio:first-of-type{border-top:0}
.fila-inicio .cuerpo{flex:1;min-width:0}
.fila-inicio .barra{display:block;margin:.35rem 0 .2rem}
.fila-inicio .fila.entre{display:flex}

/* Formularios */
label.campo{display:block;font-weight:600;margin-bottom:12px}
label.campo input,label.campo select,label.campo textarea{display:block;width:100%;margin-top:.3rem;min-height:48px;padding:.5rem .75rem;border:2px solid var(--borde);border-radius:10px;background:#fff;color:var(--texto)}
fieldset{border:1px solid var(--borde);border-radius:10px;padding:12px;margin:0 0 12px}
legend{font-weight:700;padding:0 .3rem}
.check{display:flex;align-items:center;gap:.6rem;min-height:44px;font-weight:600;cursor:pointer}
.check input{width:22px;height:22px;accent-color:#111;flex:none}
.input-grande{font-family:Lexend;font-size:2rem !important;text-align:center;min-height:72px !important;font-variant-numeric:tabular-nums}
.error{color:var(--ur-t);background:var(--ur-f);border-radius:8px;padding:.6rem .8rem;font-weight:600;margin:.5rem 0}
.ayuda{color:var(--texto-2);font-size:.92rem;font-weight:400}

/* Empleado: letra más grande */
.vista-op{font-size:18px}
.paso{display:inline-block;font-weight:700;background:var(--acento);color:var(--sobre-acento);border-radius:6px;padding:.1rem .6rem;font-family:Lexend;margin-bottom:.4rem}
.foto-prev{width:100%;max-height:260px;object-fit:contain;border-radius:10px;border:1px solid var(--borde);background:#0F172A}
.listo{text-align:center;padding:24px 8px}
.listo .circulo{width:96px;height:96px;border-radius:50%;background:var(--ok-f);color:var(--ok-t);display:grid;place-items:center;margin:0 auto 16px}
.listo .circulo .ico{width:56px;height:56px}

/* Tabla */
.tabla-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:.5rem .4rem;border-bottom:1px solid var(--borde);vertical-align:middle}
th{color:var(--texto-2);font-weight:600}
.mini-foto{width:48px;height:36px;object-fit:cover;border-radius:6px;background:#0F172A}

/* Ficha tipo Word */
.papel{background:#fff;max-width:820px;margin:0 auto;padding:40px 44px;border:1px solid var(--borde);box-shadow:0 6px 24px rgba(0,0,0,.08)}
@media (max-width:600px){.papel{padding:20px 14px}}
.papel table td,.papel table th{overflow-wrap:anywhere;border-bottom:none}

.burbuja{background:#E7FFDB;border-radius:12px;padding:12px 14px;white-space:pre-wrap;font-size:.95rem;border:1px solid #BBE5A7;overflow-wrap:anywhere}

/* Elegir perfil */
.perfil{display:flex;gap:14px;align-items:flex-start;color:inherit;cursor:pointer;width:100%;text-align:left;font:inherit}
.perfil .ic{width:52px;height:52px;border-radius:12px;background:var(--primario);color:var(--acento);display:grid;place-items:center;flex:none}
.perfil .ic .ico{width:28px;height:28px}
.pasos{counter-reset:p;list-style:none;padding:0;margin:0}
.pasos li{counter-increment:p;display:flex;gap:12px;margin-bottom:12px}
.pasos li::before{content:counter(p);flex:none;width:32px;height:32px;border-radius:50%;background:var(--acento);color:var(--sobre-acento);display:grid;place-items:center;font-family:Lexend;font-weight:700}

.badge{background:#DC2626;color:#fff;border-radius:999px;font-size:.72rem;padding:0 .45rem;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--texto);color:#fff;padding:.7rem 1.1rem;border-radius:10px;font-weight:600;z-index:50;max-width:calc(100% - 32px);text-align:center}
.vacio{text-align:center;color:var(--texto-2);padding:24px}
.filtros{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
/* Configuración → Alertas: filas que se abren para editar */
.ajuste{border-top:1px solid var(--borde)}
.ajuste:first-of-type{border-top:0}
.ajuste summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 0;min-height:56px;cursor:pointer}
.ajuste summary::-webkit-details-marker{display:none}
.ajuste summary .cuerpo{flex:1;min-width:0}
.ajuste summary .sub{display:block;color:var(--texto-2);font-size:.9rem;font-weight:400}
.ajuste summary svg{flex:none}
.ajuste[open] summary svg{transform:rotate(90deg)}
.canal{font-size:.78rem;color:var(--texto-2);white-space:nowrap}
.ajuste-campos{display:grid;gap:10px;padding:0 0 14px}
.dato{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.dato .entrada{display:flex;align-items:center;gap:6px;flex:none}
.dato input,.dato select{min-height:44px;border:2px solid var(--borde);border-radius:10px;background:#fff;color:var(--texto);padding:0 .6rem;font-size:16px}
.dato input{width:5.5rem;text-align:right}
.ejemplo-linea{margin:0;font-size:.88rem;color:var(--texto-2);background:var(--fondo);border-radius:8px;padding:.5rem .7rem}
.ejemplo-linea b{color:var(--texto)}
.check .sub{display:block;color:var(--texto-2);font-size:.9rem;font-weight:400}
.etiqueta-canal{display:inline-block;font-size:.8rem;font-weight:600;padding:.1rem .5rem;border-radius:999px;background:var(--ok-f, #ecfdf5);color:var(--ok-t, #065f46);margin-left:6px;vertical-align:middle}
.etiqueta-canal.app{background:#f1f5f9;color:#475569}
.fila-contacto{display:flex;gap:8px;margin-bottom:8px}
.fila-contacto input:not([type=checkbox]){flex:1;min-width:0}
.fila-contacto input[type=checkbox]{width:22px;height:22px;flex:none;align-self:center;accent-color:#111;cursor:pointer}
.fila-contacto.pausado input:not([type=checkbox]){opacity:.5}
.filtros .btn{flex:none}
.filtros .btn[aria-pressed="true"]{background:var(--primario);color:#fff}
.graf{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:8px}
.graf span{flex:1;background:#94A3B8;border-radius:3px 3px 0 0;min-height:2px}
.graf-ejes{display:flex;justify-content:space-between;color:var(--texto-2);font-size:.8rem}
.nota{background:#F8FAFC}

/* Listas resumidas: una fila por elemento */
.lista{background:#fff;border:1px solid var(--borde);border-radius:var(--radio);overflow:hidden;margin-bottom:16px}
.lista-cab,.lista-fila{display:grid;grid-template-columns:var(--cols);gap:12px;align-items:center;padding:12px 16px}
.lista-cab{background:#F8FAFC;font-size:.75rem;font-weight:700;color:var(--texto-2);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--borde)}
.lista-fila{border-top:1px solid #E2E8F0;color:inherit;text-decoration:none}
.lista-cab + .lista-fila{border-top:0}
a.lista-fila:hover{background:#F8FAFC}
.celda-pri{min-width:0}
.celda-pri b{display:block;overflow-wrap:anywhere}
.sub{display:block;color:var(--texto-2);font-size:.88rem;overflow-wrap:anywhere}
.solo-movil,.solo-movil-bloque{display:none}
.estado{display:inline-flex;align-items:center;gap:.45rem;font-size:.92rem;white-space:nowrap}
.estado::before{content:"";width:8px;height:8px;border-radius:50%;background:#94A3B8;flex:none}
.estado.ok::before{background:var(--ok-t)} .estado.porvencer::before{background:#C2410C} .estado.urgente::before,.estado.vencido::before{background:#B91C1C}
.avatar.chica{width:34px;height:34px;font-size:.8rem;background:#F1F5F9;color:#111}
details.tarjeta summary{cursor:pointer;min-height:28px}
.lista-simple{margin:0;padding-left:1.1rem;color:var(--texto-2)}
@media (max-width:719px){
  .lista-cab{display:none}
  .lista-fila{grid-template-columns:var(--cols-m,minmax(0,1fr) auto)}
  .lista-fila .opc,.lista-fila .opc-sub,.opc-txt{display:none}
  .solo-movil{display:inline}
  .solo-movil-bloque{display:block}
}

/* Simulación de WhatsApp */
.chat{display:flex;flex-direction:column;height:min(680px,calc(100dvh - 200px));min-height:420px;max-width:520px;margin:0 auto;border:1px solid var(--borde);border-radius:var(--radio);overflow:hidden;background:#ECE5DD}
.chat-cab{background:#075E54;color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center}
.chat-cab .avatar{background:var(--acento);color:#111}
.chat-cab small{display:block;opacity:.85}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:85%;padding:6px 10px 4px;border-radius:8px;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.12);overflow-wrap:anywhere;font-size:16px;line-height:1.4}
.msg.yo{align-self:flex-end;background:#DCF8C6}
.msg.bot{align-self:flex-start;background:#fff}
.msg .t{display:block;text-align:right;font-size:.72rem;color:#54656F;margin-top:2px}
.msg img{display:block;max-width:200px;width:100%;border-radius:6px;margin-bottom:4px}
.msg-dia{align-self:center;background:#E1F2FB;color:#334155;font-size:.8rem;border-radius:6px;padding:.15rem .6rem}
.chat-sug{display:flex;gap:6px;overflow-x:auto;padding:8px 8px 0;background:#F0F2F5}
.chat-sug button{flex:none;border:1px solid var(--borde);background:#fff;color:var(--texto);border-radius:999px;padding:.3rem .8rem;min-height:38px;cursor:pointer;font-weight:600}
.chat-input{display:flex;gap:6px;padding:8px;background:#F0F2F5;align-items:center}
.chat-input input[type=text]{flex:1;min-width:0;min-height:46px;border-radius:999px;border:1px solid var(--borde);padding:0 14px;font-size:16px;background:#fff}
.redondo{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;flex:none;background:transparent;color:#54656F}
.redondo.enviar{background:#128C7E;color:#fff}
.redondo .ico{width:22px;height:22px}
@media (prefers-reduced-motion:no-preference){.btn,.kpi{transition:filter .15s}.btn:hover,.kpi:hover{filter:brightness(.95)}}
/* Celular (dueño), estilo tipo Facebook: nombre grande arriba con botones redondos, tarjetas de borde a borde,
   pestañas abajo con línea en la activa y "Más" con accesos en cuadrícula. Mismo contenido que en el computador. */
.tabbar{display:none}
.solo-cel{display:none}
/* Tarjetas de camión en 2 columnas (celular) */
.grilla-camiones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.cam-card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(15,23,42,.08);text-decoration:none;color:inherit;display:flex;flex-direction:column;overflow:hidden}
.cam-card .foto{background:#F1F5F9;height:78px;display:grid;place-items:center;position:relative;color:#475569}
.cam-card .foto .ico{width:34px;height:34px}
.cam-card .foto .punto{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--ok-t)}
.cam-card .foto .punto.porvencer{background:#C2410C} .cam-card .foto .punto.urgente,.cam-card .foto .punto.vencido{background:#B91C1C} .cam-card .foto .punto.sinreporte{background:#94A3B8}
.cam-card .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cam-card .info b{font-family:Lexend;font-size:1rem}
.cam-card .info .sub{font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cam-card .info .estado{font-size:.8rem;white-space:normal;margin-top:4px;align-items:flex-start}
.cam-card .info .estado::before{margin-top:.35em}
.pildoras{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.pildoras a{flex:none;padding:.45rem .95rem;border-radius:999px;background:#fff;color:#334155;text-decoration:none;font-weight:600;font-size:.88rem;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.pildoras a[aria-pressed="true"]{background:#111;color:#fff}
.buscador{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:0 12px;box-shadow:0 1px 3px rgba(15,23,42,.08);margin-bottom:12px}
.buscador .ico{color:#64748B}
.buscador input{flex:1;min-width:0;border:0;outline:0;background:transparent;min-height:44px;font-size:16px}
.titulo-seccion{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 8px}
.titulo-seccion h2{margin:0}
.titulo-seccion a{font-weight:600;font-size:.9rem;color:#111}
.perfil-centro{text-align:center;padding:20px 16px}
.perfil-centro .avatar{width:72px;height:72px;font-size:1.4rem;margin:0 auto 10px}
.perfil-centro b{display:block;font-size:1.05rem}
@media (max-width:899px){
  body.con-side{--top-bg:#FFFFFF;--top-fg:#111111;--top-btn:#E4E6EB;--fondo:#E9EBEE;font-size:15px}
  body.con-side .top{min-height:56px;padding:.35rem 12px;border-bottom:1px solid #DADDE1}
  body.con-side .btn-menu,body.con-side .no-movil{display:none !important}
  body.con-side .top .pill:not(.off){display:none}
  body.con-side .top .marca{font-size:1.4rem;letter-spacing:-.02em}
  body.con-side .top .marca .logo{width:1.25em;height:1.25em}
  body.con-side .top .volver{min-height:40px;width:40px;padding:0;justify-content:center;border-radius:50%}
  body.con-side .top .volver .volver-txt{display:none}
  body.con-side .top .volver:not([hidden]) ~ .marca{font-size:1.1rem}
  body.con-side .top .volver:not([hidden]) ~ .marca .logo{display:none}
  body.con-side .top .volver:not([hidden]) ~ .marca .marca-txt{position:static;width:auto;height:auto;overflow:hidden;clip:auto}
  body.con-side #campana,body.con-side .top .avatar{display:grid !important;width:40px;height:40px;border-radius:50%;background:#E4E6EB;color:#111;place-items:center}
  body.con-side .top .avatar{font-size:.85rem;text-decoration:none}
  body.con-side #campana .ico{width:21px;height:21px}
  body.con-side .demo-banda:not(.alerta):not(.local){display:none}
  body.con-side main{padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
  body.con-side h1{font-size:1.3rem}
  body.con-side h2{font-size:1.05rem}
  /* tarjetas redondeadas y separadas; cada fila de una lista es su propio cuadro */
  body.con-side{--fondo:#F2F3F5}
  body.con-side .tarjeta{border:0;border-radius:16px;box-shadow:0 1px 3px rgba(15,23,42,.08);padding:14px 16px;margin-bottom:12px}
  body.con-side .grid,body.con-side .grid-inicio{gap:12px}
  body.con-side .lista{background:transparent;border:0;overflow:visible;display:grid;gap:8px}
  body.con-side .lista-fila{background:#fff;border:0;border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
  body.con-side .kpi{border:0;box-shadow:0 1px 3px rgba(15,23,42,.08)}
  body.con-side .solo-pc{display:none !important}
  body.con-side .solo-cel{display:block}
  body.con-side .btn{min-height:44px;padding:.5rem .9rem}
  body.con-side .btn.chico{min-height:38px;padding:.3rem .7rem;font-size:.9rem}
  body.con-side .lista-fila{padding:11px 16px}
  body.con-side .cab{margin-bottom:10px}
  body.con-side .kpi{border-radius:12px}
  /* pestañas abajo: la activa en negro con una línea amarilla arriba */
  body.con-side .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid #DADDE1;padding:0 2px env(safe-area-inset-bottom)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;color:#65676B;text-decoration:none;font-size:.68rem;font-weight:600;position:relative;white-space:nowrap}
  .tabbar a .ico{width:24px;height:24px}
  .tabbar a[aria-current="page"]{color:#111}
  .tabbar a[aria-current="page"]::before{content:"";position:absolute;top:0;left:14%;right:14%;height:3px;border-radius:0 0 3px 3px;background:var(--acento);box-shadow:0 1px 0 #111}
  .tabbar .badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;font-size:.7rem;display:grid;place-items:center;padding:0 4px}
  #campana .contador{top:-2px;right:-3px}
}
/* "Más": perfil arriba y accesos en cuadrícula (como el menú de Facebook) */
.menu-perfil{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.menu-grilla{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.menu-grilla a{background:#fff;border-radius:12px;padding:12px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 2px rgba(0,0,0,.12);min-height:84px;position:relative}
.menu-grilla a .ico{width:26px;height:26px}
.menu-grilla a b{font-size:.95rem}
.menu-grilla .badge{position:absolute;top:10px;right:10px}
@media print{.tabbar{display:none !important}}
@media print{.side,.scrim,.top,.demo-banda,.no-print{display:none !important}body.con-side .contenido{margin-left:0}main{padding:0}.tarjeta{break-inside:avoid}.papel{border:0;box-shadow:none;padding:0}}

<script>
'use strict';
/* ============ Utilidades ============ */
const DIA = 86400000;
const $ = (s, el = document) => el.querySelector(s);
const ic = id => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n0 = v => Math.round(v).toLocaleString('es-CL');
const n1 = v => Number(v).toLocaleString('es-CL', { maximumFractionDigits: 1 });
const pad = v => String(v).padStart(2, '0');
const hoy0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const isoLocal = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const dISO = s => s + 'T12:00'; // fecha 'AAAA-MM-DD' a mediodía local, para no correr el día por zona horaria
const fecha = d => new Date(d).toLocaleDateString('es-CL', { day: '2-digit', month: '2-digit', year: 'numeric' });
const fechaCorta = d => new Date(d).toLocaleDateString('es-CL', { day: '2-digit', month: '2-digit' });
const hora = d => new Date(d).toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', hour12: false });
const diasHasta = d => Math.round((new Date(d).setHours(0, 0, 0, 0) - hoy0()) / DIA);
// Patentes chilenas: HKTZ48 → HK·TZ·48 y AB1234 → AB·12·34; cualquier otra se muestra tal cual
const fmtPatente = p => String(p).toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/^([A-Z]{2})([A-Z]{2}|[0-9]{2})([0-9]{2})$/, '$1·$2·$3');
const iniciales = n => String(n).split(' ').filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase();
const primerNombre = n => String(n).split(' ')[0];
function fechaLarga() { const s = new Date().toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' }); return s[0].toUpperCase() + s.slice(1); }
function saludo() { const h = new Date().getHours(); return h < 12 ? 'Buenos días' : h < 20 ? 'Buenas tardes' : 'Buenas noches'; }
function cuando(d) {
  const dd = -diasHasta(d);
  if (dd === 0) return 'hoy ' + hora(d);
  if (dd === 1) return 'ayer ' + hora(d);
  return 'hace ' + dd + ' días';
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200);
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* Foto de ejemplo: dibujo de un horómetro con la lectura */
function fotoEjemplo(valor) {
  const txt = n1(valor).padStart(7, ' ');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200"><rect width="320" height="200" fill="#1f2937"/><rect x="30" y="40" width="260" height="120" rx="14" fill="#0b0f14" stroke="#64748b" stroke-width="4"/><text x="160" y="72" fill="#94a3b8" font-family="Arial" font-size="16" text-anchor="middle">HORAS</text><text x="160" y="130" fill="#fbbf24" font-family="Courier New,monospace" font-size="44" font-weight="bold" text-anchor="middle">${txt}</text></svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

/* ============ Datos de ejemplo ============ */
const CLAVE = 'flota-demo-v4'; // v4: un solo camión para la presentación
function crearDemo() {

async function pedirToken(tipo, cuerpo) {
  const res = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=${tipo}`, { method: 'POST', headers: { apikey: SUPA_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) });
  const d = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(d.error_description || d.msg || d.message || 'Error ' + res.status);
  guardarSesion({ access: d.access_token, refresh: d.refresh_token, vence: Date.now() + d.expires_in * 1000, correo: d.user && d.user.email });
}
async function sesionVigente() { // renueva el acceso si vence en menos de 2 minutos
  if (!SESION) return false;
  if (SESION.vence - Date.now() > 120000) return true;
  if (!RENOVANDO) RENOVANDO = pedirToken('refresh_token', { refresh_token: SESION.refresh }).then(() => true, () => { guardarSesion(null); return false; }).finally(() => { RENOVANDO = null; });
  return RENOVANDO;
}
// con sesión va el token del usuario; sin sesión, la clave nueva (sb_publishable_) va solo en apikey
const supaHeaders = () => ({ apikey: SUPA_KEY, ...(SESION ? { Authorization: 'Bearer ' + SESION.access } : SUPA_KEY.startsWith('eyJ') ? { Authorization: 'Bearer ' + SUPA_KEY } : {}) });

/* Estado compartido: camiones, contratos y configuración se guardan en la tabla estado_app (un solo registro).
   Los registros del horómetro vienen de la tabla lecturas. Si dos personas editan a la vez, gana el último en guardar. */
let VERSION_NUBE = null, SUBIDA = null;
function subirEstado() {
  clearTimeout(SUBIDA);
  SUBIDA = setTimeout(async () => {
    if (!(await sesionVigente())) return sesionPerdida();
    S._v = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const { chat, ...datos } = S;
    try {
      const res = await fetch(`${SUPA_URL}/rest/v1/estado_app`, { method: 'POST',
        headers: { ...supaHeaders(), 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify({ id: 1, datos, actualizado: new Date().toISOString() }) });
      if (res.status === 401) return sesionPerdida();
      if (!res.ok) throw new Error('HTTP ' + res.status);
      VERSION_NUBE = S._v;
    } catch (e) { toast('No se pudo guardar en línea. Revisa la conexión.'); }
    SUBIDA = null;
  }, 600);
}
async function bajarEstado() { // devuelve true si llegaron cambios hechos en otro equipo
  if (SUBIDA) return false; // hay cambios propios por subir: no se pisan
  const res = await fetch(`${SUPA_URL}/rest/v1/estado_app?select=datos&id=eq.1`, { headers: supaHeaders() });
  if (res.status === 401) throw Object.assign(new Error('sesión'), { sesion: true });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const [fila] = await res.json();
  NUBE = true;
  if (!fila) { subirEstado(); return false; } // primera vez: se sube lo que hay en este equipo
  if (fila.datos._v === VERSION_NUBE) return false;
  VERSION_NUBE = fila.datos._v;
  S = { ...fila.datos, rol: 'dueno', chat: S.chat, estados: fila.datos.estados || {} };
  completarDatos();
  try { localStorage.setItem(CLAVE, JSON.stringify(S)); } catch (e) { /* sin almacenamiento */ }
  return true;
}

let FIRMA = '', ULTIMO_ID = null;
async function traerLecturas() {
  if (!SESION) return; // sin sesión no se consulta nada (la pantalla de entrada ya está a la vista)
  if (!(await sesionVigente())) return sesionPerdida();
  try {
    const cambioEstado = await bajarEstado();
    const res = await fetch(`${SUPA_URL}/rest/v1/lecturas?select=id,patente,valor,fecha,origen,nombre&order=fecha.asc`, { headers: supaHeaders() });
    if (res.status === 401) throw Object.assign(new Error('sesión'), { sesion: true });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const filas = await res.json();
    // Con un solo camión, la patente y el límite mandan desde Supabase: se cambian en un solo lugar (supabase/cambiar-camion.sql)
    const rc = await fetch(`${SUPA_URL}/rest/v1/camiones?select=patente,limite`, { headers: supaHeaders() });
    const cams = rc.ok ? await rc.json() : [];
    let cambioCamion = false;
    if (cams.length === 1 && S.camiones.length === 1) {
      const c = S.camiones[0], k = cams[0];
      if (c.patente !== k.patente || c.limite !== Number(k.limite)) { c.patente = k.patente; c.limite = Number(k.limite); cambioCamion = true; guardar(); }
    }
    $('#banda').classList.remove('alerta'); // conexión bien: la franja se esconde
    const firma = filas.map(f => f.id).join() + JSON.stringify(S.estados);
    if (firma === FIRMA && !cambioCamion && !cambioEstado) return;
    FIRMA = firma;
    const ult = filas.length ? filas.reduce((a, b) => (a.id > b.id ? a : b)) : null;
    if (ult && ULTIMO_ID !== null && ult.id > ULTIMO_ID && ult.origen === 'whatsapp') toast(`Llegó por WhatsApp: ${fmtPatente(ult.patente)} · ${n1(ult.valor)} h`);
    if (ult) ULTIMO_ID = ult.id;
    S.camiones.forEach(c => {
      const ls = filas.filter(f => f.patente === c.patente);
      if (!ls.length) return;
      c.lecturas = ls.map(f => {
        const id = 'r' + f.id, e = S.estados[id] || {};
        return { id, fecha: Date.parse(f.fecha), valor: Number(f.valor), quien: f.nombre || 'WhatsApp', origen: f.origen, foto: false, img: null, sync: 'enviado',
          estado: e.estado || (f.origen === 'whatsapp' ? 'pendiente' : 'validado'), nota: e.nota };
      });
    });
    const escribiendo = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement && document.activeElement.tagName);
    if (!escribiendo) render();
  } catch (e) {
    if (e.sesion) return sesionPerdida();
    $('#banda').textContent = 'Sin conexión con la base de datos · reintentando…'; $('#banda').classList.add('alerta');
  }
}

const RANGO = { vencido: 4, urgente: 3, porvencer: 2, sinreporte: 1, ok: 0 };
const ETQ = { ok: 'Al día', porvencer: 'Por vencer', urgente: 'Urgente', vencido: 'Vencido', sinreporte: 'Sin reporte' };

function estadoPlazo(d, urgente, aviso) {
  let e = 'ok', txt = `Vence en ${d} días`;
  if (d < 0) { e = 'vencido'; txt = `Venció hace ${-d} ${-d === 1 ? 'día' : 'días'}`; }
  else if (d === 0) { e = 'vencido'; txt = 'Vence hoy'; }
  else if (d <= urgente) e = 'urgente';
  else if (d <= aviso) e = 'porvencer';
  if (d === 1) txt = 'Vence mañana';
  return { e, d, txt };
}
const estadoRT = c => estadoPlazo(diasHasta(dISO(c.rtVence)), S.config.diasUrgente, S.config.diasPorVencer);
const estadoContrato = k => estadoPlazo(diasHasta(dISO(k.termino)), S.config.diasContratoUrgente, S.config.diasContratoAviso);
function promedioDiario(c) {
  const ls = lecturasOk(c); if (ls.length < 2) return 0;
  const desde = Date.now() - 14 * DIA;
  const rec = ls.filter(l => l.fecha >= desde);
  const a = rec.length ? ls[Math.max(0, ls.indexOf(rec[0]) - 1)] : ls[0];
  const b = ls[ls.length - 1];
  return (b.valor - a.valor) / Math.max(1, (b.fecha - a.fecha) / DIA);
}
function estadoHoras(c) {
  const u = ultima(c); const actual = u ? u.valor : 0;
  const pct = actual / c.limite * 100;
  const prom = promedioDiario(c);
  const resta = c.limite - actual;
  const dias = prom >= 0.5 ? Math.ceil(resta / prom) : null; // con menos de media hora diaria no se proyecta
  let e = 'ok';
  if (pct >= 100) e = 'vencido'; else if (pct >= S.config.pctUrgente) e = 'urgente'; else if (pct >= S.config.pctAviso) e = 'porvencer';
  const fechaLim = dias != null ? new Date(Date.now() + dias * DIA) : null;
  return { e, actual, pct, prom, resta, dias, fechaLim, txt: pct >= 100 ? 'Límite superado' : `${Math.floor(pct)}% del límite` };
}
/* Mantención preventiva cada S.config.intervaloMant horas de motor (250 h según el cliente).
   Si no hay mantención registrada, se estima según la PRIMERA lectura (último múltiplo del intervalo bajo ella):
   así, si el camión pasa la próxima mantención y nadie la registra, queda "atrasada". */
function estadoMant(c) {
  const iv = S.config.intervaloMant, u = ultima(c), actual = u ? u.valor : 0;
  const m = (c.mantenciones || [])[(c.mantenciones || []).length - 1];
  const primera = lecturasOk(c)[0], base = m ? m.valor : Math.floor((primera ? primera.valor : actual) / iv) * iv;
  const prox = base + iv, resta = prox - actual, prom = promedioDiario(c);
  const fechaProx = resta > 0 && prom >= 0.5 ? new Date(Date.now() + Math.ceil(resta / prom) * DIA) : null;
  let e = 'ok';
  if (resta <= 0) e = 'vencido'; else if (resta <= S.config.horasMantUrgente) e = 'urgente'; else if (resta <= S.config.horasMantAviso) e = 'porvencer';
  return { e, base, prox, resta, fechaProx, ultima: m, txt: resta <= 0 ? `Atrasada ${n0(-resta)} h` : `Faltan ${n0(resta)} h` };
}
function sinReporte(c) {
  if (!c.contratoId) return { si: false, dias: null }; // un camión disponible no trabaja: no se le exige reporte
  const u = ultima(c); if (!u) return { si: true, dias: null };
  const dias = -diasHasta(u.fecha);
  return { si: dias > S.config.diasSinReporte, dias };
}
function estadoGeneral(c) {
  let e = [estadoRT(c).e, estadoHoras(c).e, estadoMant(c).e].reduce((x, y) => (RANGO[y] > RANGO[x] ? y : x));
  if (e === 'ok' && sinReporte(c).si) e = 'sinreporte';
  return e;
}
// Lo más urgente de un camión, dicho en corto (p. ej. "Mantención: faltan 48 h")
function motivo(c) {
  const rt = estadoRT(c), m = estadoMant(c), h = estadoHoras(c), sr = sinReporte(c);
  const xs = [
    { e: m.e, txt: m.resta > 0 ? `Mantención: faltan ${n0(m.resta)} h` : `Mantención atrasada ${n0(-m.resta)} h` },
    { e: rt.e, txt: rt.d < 0 ? 'Rev. técnica vencida' : rt.d === 0 ? 'Rev. técnica vence hoy' : `Rev. técnica en ${rt.d} ${rt.d === 1 ? 'día' : 'días'}` },
    { e: h.e, txt: h.pct >= 100 ? 'Límite de horas superado' : `Horas: ${Math.floor(h.pct)}% del límite` },
  ].filter(x => x.e !== 'ok').sort((a, b) => RANGO[b.e] - RANGO[a.e]);
  if (xs.length) return { e: xs[0].e, txt: xs[0].txt + (xs.length > 1 ? ` y ${xs.length - 1} más` : '') };
  return sr.si ? { e: 'sinreporte', txt: `Sin reporte hace ${sr.dias} días` } : { e: 'ok', txt: 'Al día' };
}

      msg: `${p} (${c.tipo}): ${Math.floor(h.pct)}% del límite${h.pct < 100 && h.fechaLim ? ', lo alcanza aprox. el ' + fechaCorta(h.fechaLim) : ''}`, href: '#camion/' + c.id });
    if (s.si) xs.push({ tipo: 'Sin reporte', e: 'sinreporte', titulo: p, detalle: `${s.dias} días sin registrar horómetro`, msg: `${p}: ${s.dias} días sin registrar horómetro`, href: '#camion/' + c.id });

function registrarMant(id) {
  const c = camion(id), u = ultima(c, true), actual = u ? u.valor : 0, m = estadoMant(c);
  const txt = prompt(`¿Con qué horómetro se hizo la mantención de ${fmtPatente(c.patente)}?`, n1(actual).replace(/\./g, ''));
  if (txt === null) return;
  const v = leerNumero(txt);
  if (isNaN(v) || v <= 0) { toast('Escribe el horómetro solo con números.'); return; }
  if (v > actual + 0.5) { toast(`No puede ser mayor que el horómetro actual (${n1(actual)} h).`); return; }
  if (m.ultima && v <= m.ultima.valor) { toast(`Debe ser mayor que la mantención anterior (${n1(m.ultima.valor)} h).`); return; }
  c.mantenciones = [...(c.mantenciones || []), { valor: v, fecha: Date.now() }];
  guardar(); toast(`Mantención registrada. La próxima es a las ${n0(v + S.config.intervaloMant)} h.`); render();
}
function celdaEstado(l, cid) {
  if (l.estado === 'validado') return chip('ok', 'Validado');
  if (l.estado === 'observado') return chip('urgente', 'Observado') + (l.nota ? `<div class="sec" style="font-size:.85rem">${esc(l.nota)}</div>` : '');
  return chip('porvencer', 'Por validar') + `<div class="acciones" style="gap:6px;margin-top:6px"><button class="btn chico pri" onclick="validar('${cid}','${l.id}',true)">Validar</button><button class="btn chico" onclick="validar('${cid}','${l.id}',false)">Observar</button></div>`;
}
function validar(cid, lid, ok) {
  const l = camion(cid).lecturas.find(x => x.id === lid);
  if (ok) { l.estado = 'validado'; toast('Registro validado'); }
  else { const nota = prompt('¿Qué tiene de malo este registro? (queda anotado en el registro)', 'No se lee bien el número.'); if (nota === null) return; l.estado = 'observado'; l.nota = nota; toast('Registro observado'); }
  S.estados[lid] = { estado: l.estado, nota: l.nota };
  guardar(); render();
}

// El dueño registra la lectura desde la ficha del camión; queda validada porque la anota él mismo
async function registrarDueno(ev, id) {
  ev.preventDefault();
  const c = camion(id), txt = ev.target.lectura.value;
  const v = leerNumero(txt);
  const error = txt.trim() ? validarLectura(c, v) : 'Escribe el número del horómetro, solo con números.';
  if (error) { toast(error); ev.target.lectura.focus(); return; }
  if (REAL) {
    const btn = ev.target.querySelector('button'); btn.disabled = true;
    try {
      if (!(await sesionVigente())) return sesionPerdida();
      const res = await fetch(`${SUPA_URL}/rest/v1/rpc/registrar_lectura`, { method: 'POST', headers: { ...supaHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify({ p_patente: c.patente, p_valor: v }) });
      if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.message || 'Error ' + res.status); }
      toast(`Horómetro registrado: ${n1(v)} h`); FIRMA = ''; await traerLecturas();
      revisarAvisos(c.patente);
    } catch (e) { toast('No se pudo registrar: ' + e.message); btn.disabled = false; }
    return;
  }
  c.lecturas.push({ id: 'l' + Date.now(), fecha: Date.now(), valor: v, usuario: 'u0', foto: false, img: null, estado: 'validado', sync: 'enviado' });
  guardar(); toast(`Horómetro registrado: ${n1(v)} h`); render();
}

function guardarContrato(ev, id) {
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const d = Object.fromEntries(fd); const sel = fd.getAll('camiones');
  if (d.termino <= d.inicio) { toast('La fecha de término debe ser posterior al inicio'); return; }
  if (!sel.length) { toast('Elige al menos un camión'); return; }
  const datos = { empresa: d.empresa.trim(), rut: d.rut.trim(), faena: d.faena.trim(), inicio: d.inicio, termino: d.termino, notas: d.notas.trim(),
    admin: { nombre: d.adminNombre.trim(), cargo: d.adminCargo.trim(), telefono: d.adminTelefono.trim(), correo: d.adminCorreo.trim() } };
  let k;
  if (id === 'nuevo') { k = { id: 'k' + Date.now(), numero: `CT-${new Date().getFullYear()}-${String(S.contratos.length + 30).padStart(3, '0')}`, ...datos }; S.contratos.push(k); }
  else { k = contrato(id); Object.assign(k, datos); }
  S.camiones.forEach(c => { if (sel.includes(c.id)) c.contratoId = k.id; else if (c.contratoId === k.id) c.contratoId = null; });
  guardar(); toast('Contrato guardado'); ir('contrato/' + k.id);
}
function finalizarContrato(id) {
  const k = contrato(id);
  if (!confirm(`¿Finalizar el contrato con ${k.empresa}? Sus camiones quedarán disponibles para arriendo.`)) return;
  S.camiones.forEach(c => { if (c.contratoId === id) c.contratoId = null; });
  S.contratos = S.contratos.filter(x => x.id !== id);
  S.usuarios.forEach(u => { if (u.contratoId === id) u.activo = false; });
  guardar(); toast('Contrato finalizado'); ir('contratos');
}

/* Avisos automáticos por WhatsApp al dueño (función "avisos" de Supabase) */
async function llamarAvisos(cuerpo) {
  if (!(await sesionVigente())) { sesionPerdida(); throw new Error('sesión'); }
  const res = await fetch(`${SUPA_URL}/functions/v1/avisos`, { method: 'POST', headers: { ...supaHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) });
  const d = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(d.error || 'Error ' + res.status);
  return d;
}
async function revisarAvisos(patente) {
  try { const d = await llamarAvisos({ patente }); if (d.enviados) toast('Se envió un aviso automático por WhatsApp'); } catch (e) { /* el registro ya quedó guardado */ }
}
async function avisoPrueba(btn) {
  btn.disabled = true;
  try { await llamarAvisos({ prueba: true }); toast('Aviso de prueba enviado. Revisa WhatsApp.'); }
  catch (e) { if (e.message !== 'sesión') toast('No se pudo enviar: ' + e.message); }
  btn.disabled = false;
}
async function revisarTodo(btn) { // la misma revisión que se hace sola cada día, pero al tiro
  btn.disabled = true;
  try { const d = await llamarAvisos({}); toast(d.enviados ? `Se ${d.enviados === 1 ? 'envió 1 aviso' : `enviaron ${d.enviados} avisos`} por WhatsApp` : 'Todo revisado: no hay avisos nuevos'); cargarEnviados(); }
  catch (e) { if (e.message !== 'sesión') toast('No se pudo revisar: ' + e.message); }
  btn.disabled = false;
}

    <div class="acciones"><button class="btn pri" style="flex:1">Guardar</button>${nuevo ? '' : `<button type="button" class="btn peligro" onclick="quitarUsuario('${id}')">Quitar usuario</button>`}</div>
  </form>`;
};
function mostrarCamposRol(rol) { document.querySelectorAll('fieldset[data-rol]').forEach(f => f.hidden = f.dataset.rol !== rol); }
function guardarUsuario(ev, id) {
  ev.preventDefault();
  const fd = new FormData(ev.target); const d = Object.fromEntries(fd);
  const otrosDuenos = S.usuarios.filter(u => u.rol === 'dueno' && u.id !== id && u.activo).length;
  if ((d.rol !== 'dueno' || !d.activo) && !otrosDuenos && (id === 'nuevo' ? false : usuario(id).rol === 'dueno')) { toast('Debe quedar al menos un dueño con acceso'); return; }
  if (d.rol === 'cliente' && !d.contratoId) { toast('Elige la empresa que verá este cliente'); return; }
  const datos = { nombre: d.nombre.trim(), correo: d.correo.trim(), telefono: d.telefono.trim(), rol: d.rol, activo: !!d.activo, contratoId: d.rol === 'cliente' ? d.contratoId : null };
  let u;
  if (id === 'nuevo') { u = { id: 'u' + Date.now(), acceso: null, ...datos }; S.usuarios.push(u); } else { u = S.usuarios.find(x => x.id === id); Object.assign(u, datos); }
  const sel = d.rol === 'empleado' ? fd.getAll('camiones') : [];
  S.camiones.forEach(c => { if (sel.includes(c.id)) c.operador = u.id; else if (c.operador === u.id) c.operador = ''; });
  guardar(); toast('Usuario guardado'); ir('usuarios');
}
function quitarUsuario(id) {
  const u = S.usuarios.find(x => x.id === id);
  if (u.rol === 'dueno' && S.usuarios.filter(x => x.rol === 'dueno').length === 1) { toast('No puedes quitar al único dueño'); return; }
  if (!confirm(`¿Quitar a ${u.nombre}? Ya no podrá entrar a la app.`)) return;
  S.usuarios = S.usuarios.filter(x => x.id !== id);
  S.camiones.forEach(c => { if (c.operador === id) c.operador = ''; });
  guardar(); toast('Usuario quitado'); ir('usuarios');
}

/* ============ Mi cuenta (Supabase Auth: /auth/v1/user) ============ */
async function cuentaAuth(metodo, cuerpo) {
  if (!(await sesionVigente())) { sesionPerdida(); throw new Error('sesión'); }
  const res = await fetch(`${SUPA_URL}/auth/v1/user`, { method: metodo, headers: { ...supaHeaders(), 'Content-Type': 'application/json' }, body: cuerpo ? JSON.stringify(cuerpo) : undefined });
  const d = await res.json().catch(() => ({}));
  if (!res.ok) {
    const m = d.msg || d.error_description || d.message || 'Error ' + res.status;
    throw new Error(/different from the old/i.test(m) ? 'La contraseña nueva debe ser distinta de la actual' : /at least/i.test(m) ? 'La contraseña es muy corta' : /reauthentication/i.test(m) ? 'Por seguridad, cierra sesión, vuelve a entrar e inténtalo de nuevo' : m);
  }
  return d;
}

let CUENTAS = null;

// Ejemplos con los números que el dueño está escribiendo (se actualizan mientras escribe)
function pintarEjemplos(c) {
  const pon = (id, html) => { const el = $('#ej-' + id); if (el) el.innerHTML = html; };
  const res = (id, txt) => { const el = $('#res-' + id); if (el) el.textContent = txt; };
  const dia = d => fecha(hoy0().getTime() + d * DIA);
  const DIAS = ['', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];
  const d = (x) => `${x} ${x === 1 ? 'día' : 'días'}`;
  // Resumen de cada fila (se ve sin abrirla)
  res('mant', `Cada ${n0(c.intervaloMant)} h · avisa faltando ${n0(c.horasMantAviso)} h`);
  res('lim', `Avisa al ${c.pctAviso} % del límite`);
  res('rt', `Avisa ${d(c.diasPorVencer)} antes`);
  res('con', `Avisa ${d(c.diasContratoAviso)} antes del término`);
  res('sr', `Después de ${d(c.diasSinReporte)} sin registros`);
  // Ejemplos de una línea con los números que se están escribiendo
  const resumen = c.resumenFrec === 'diario' ? `📋 resumen todos los días a las ${hh(c.horaAvisos)}`
    : c.resumenFrec === 'semanal' ? `📋 resumen cada ${DIAS[c.resumenDia] || 'lunes'} a las ${hh(c.horaAvisos)}` : '';
  pon('como', `Te llega: ${[c.avisoInmediato ? '🟡🔴 aviso al momento' : '', resumen].filter(Boolean).join(' + ') || '<b>nada</b> (todo apagado)'}.`);
  pon('reg', c.validarSalto ? 'Ej.: no deja sumar 90 h si pasaron 2 h.' : 'Apagado: acepta cualquier salto de horas.');
  const prox = 7250 + (c.intervaloMant || 250);
  pon('mant', `Ej.: mantención a las <b>${n0(prox)} h</b> → 🟡 a las <b>${n0(prox - c.horasMantAviso)} h</b> · 🔴 a las <b>${n0(prox - c.horasMantUrgente)} h</b>`);
  pon('lim', `Ej.: límite de <b>12.000 h</b> → 🟡 a las <b>${n0(12000 * c.pctAviso / 100)} h</b> · 🔴 a las <b>${n0(12000 * c.pctUrgente / 100)} h</b>`);
  pon('rt', `Ej.: vence el <b>${dia(45)}</b> → 🟡 el <b>${dia(45 - c.diasPorVencer)}</b> · 🔴 el <b>${dia(45 - c.diasUrgente)}</b>`);
  pon('con', `Ej.: termina el <b>${dia(90)}</b> → 🟡 el <b>${dia(90 - c.diasContratoAviso)}</b> · 🔴 el <b>${dia(90 - c.diasContratoUrgente)}</b>`);
  pon('sr', `Ej.: último registro hoy → aparece "sin reporte" el <b>${dia(c.diasSinReporte + 1)}</b>`);
}
function guardarAlertas(ev) {
  ev.preventDefault();
  const nuevo = { ...S.config };
  const TEXTO = ['validarSalto', 'avisoInmediato', 'resumenFrec'];
  for (const [k, v] of new FormData(ev.target)) if (!TEXTO.includes(k)) nuevo[k] = Math.max(0, Number(v) || 0);

  if (nuevo.intervaloMant < 1) { abrir('mant'); toast('La mantención debe ser cada 1 hora o más'); return; }
  if (nuevo.horasMantAviso >= nuevo.intervaloMant) { abrir('mant'); toast('El aviso de mantención debe ser menor que el intervalo de mantención'); return; }

async function guardarCamion(ev, id) {

  if (id === 'nuevo') {

      } catch (e) { toast('No se pudo agregar: ' + e.message); btn.disabled = false; btn.textContent = 'Guardar'; return; }

    const c = { id: 'c' + Date.now(), contratoId: null, ...datos, mantenciones: d.ultMant ? [{ valor: Number(d.ultMant), fecha: null }] : [],
      lecturas: [{ id: 'l' + Date.now(), fecha: fechaL, valor: Number(d.inicial), usuario: 'u0', quien: 'Lectura inicial', foto: false, estado: 'validado', sync: 'enviado' }] };

    if (REAL) setTimeout(() => revisarAvisos(datos.patente), 2500); // espera a que el cambio se suba a Supabase
  }
}

/* Reglas del horómetro (las usan la app y el chat de WhatsApp): devuelve el error o '' si está bien */
function validarLectura(c, v) {
  const u = ultima(c, true);
  if (isNaN(v) || v <= 0) return 'Escribe el número del horómetro, solo con números.';
  if (u && v < u.valor) return `El número es menor que la última vez (${n1(u.valor)} h). El horómetro nunca baja: revisa que esté bien escrito.`;
  if (u && S.config.validarSalto) { // regla opcional (Configuración → Alertas → Registro del horómetro)
    const pasaron = (Date.now() - u.fecha) / 3600000;
    if (v - u.valor > pasaron + 0.5) return `Son ${n1(v - u.valor)} horas más que la última vez, pero desde entonces solo han pasado ${n1(pasaron)} horas. Revisa el número.`;
  }
  return '';
}
// "7.450" o "7 450" = 7450; "7450,5" o "7450.5" = 7450,5
function leerNumero(txt) {
  let s = String(txt).trim().replace(/\s/g, '');
  if (/^\d+\.\d$/.test(s)) return Number(s);
  return Number(s.replace(/\./g, '').replace(',', '.'));
}
function paso1(id) {
  const c = camion(id);
  REG.valor = $('#lect').value;
  REG.error = $('#lect').value.trim() ? validarLectura(c, leerNumero(REG.valor)) : 'Escribe el número del horómetro, solo con números.';
  if (!REG.error) { REG.valor = leerNumero(REG.valor); REG.paso = 2; }
  render();
}
function achicarFoto(f, listo) { // se achica para no llenar la memoria del celular
  const img = new Image(); const url = URL.createObjectURL(f);
  img.onload = () => {
    const k = Math.min(1, 640 / Math.max(img.width, img.height));
    const cv = document.createElement('canvas'); cv.width = img.width * k; cv.height = img.height * k;
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url); listo(cv.toDataURL('image/jpeg', 0.7));
  };
  img.src = url;
}
function cargarFoto(inp) {
  const f = inp.files[0]; if (!f) return;
  achicarFoto(f, foto => { REG.foto = foto; REG.error = ''; render(); });
}
function paso2() { if (!REG.foto) { REG.error = 'Falta la foto. Toca "Tomar foto".'; render(); return; } REG.error = ''; REG.paso = 3; render(); }
function guardarRegistro() {
  const c = camion(REG.id);

  c.lecturas.push({ id: 'l' + Date.now(), fecha: Date.now(), valor: REG.valor, usuario: EMP_ID, foto: true, img: REG.foto.length < 120000 ? REG.foto : null, estado: 'pendiente', sync: offline ? 'cola' : 'enviado' });
  guardar(); REG.done = true; REG.offline = offline; render();
}

function chatFoto(inp) { CHAT_TECLADO = false; const f = inp.files[0]; if (f) achicarFoto(f, foto => chatRecibir('', foto)); }

    return 'Recibí la foto 👍\n¿De qué camión y cuánto marca? Escribe la patente y el número, por ejemplo:\n' + (cs[0] ? `${cs[0].patente} ${sugerido(cs[0])}` : 'KDLP21 7450');
  }
  const T = txt.toUpperCase();
  if (/^(HOLA|AYUDA|MENU|MENÚ|INICIO|BUENAS|BUENOS)/.test(T.trim())) return chatAyuda();
  // patente: 2 letras + 2 letras/números + 2 números, con o sin separadores
  const mp = T.match(/\b([A-Z]{2})[\s·.\-]?([A-Z0-9]{2})[\s·.\-]?(\d{2})\b/);
  const resto = mp ? T.replace(mp[0], ' ') : T;
  const mn = resto.match(/\d[\d.\s]*(?:,\d+)?/);
  let c = null;
  if (mp) {
    const pat = mp[1] + mp[2] + mp[3];
    c = cs.find(x => x.patente === pat);
    if (!c) return `No encuentro el camión ${fmtPatente(pat)} entre tus camiones asignados.\nTus camiones son: ${lista || 'ninguno'}.\nSi es un error, avísale a la oficina.`;
  } else if (ctx.cid && mn) c = camion(ctx.cid); // respondió solo el número a la pregunta anterior
  if (!c) {
    if (mn && cs.length === 1) c = cs[0];
    else return `No entendí de qué camión es 🤔\nEscribe la patente y el número, por ejemplo:\n${cs[0] ? `${cs[0].patente} ${sugerido(cs[0])}` : 'KDLP21 7450'}`;
  }
  if (!mn) { ctx.cid = c.id; guardar(); return `¿Cuánto marca el horómetro de ${fmtPatente(c.patente)}? Escribe solo el número.`; }
  const v = leerNumero(mn[0]);
  const err = validarLectura(c, v);
  if (err) { ctx.cid = c.id; guardar(); return `⚠️ ${err}\nEscribe el número de nuevo.`; }
  const u = ultima(c, true);
  const foto = img || ctx.foto || null;
  const l = { id: 'l' + Date.now(), fecha: Date.now(), valor: v, usuario: EMP_ID, foto: !!foto, img: foto && foto.length < 120000 ? foto : null, estado: 'pendiente', sync: 'enviado', origen: 'whatsapp' };
  c.lecturas.push(l);
  ch.ctx = foto ? {} : { ultimo: { cid: c.id, lid: l.id } };
  guardar();
  return `✅ *Registrado*\n${fmtPatente(c.patente)} · ${n1(v)} h\n${u ? `+${n1(v - u.valor)} h desde ${cuando(u.fecha)}.` : 'Primer registro.'}\n${foto ? '📷 Foto guardada como respaldo.' : 'Si puedes, manda una foto del horómetro como respaldo.'}\n¡Gracias, ${primerNombre(usuario(EMP_ID).nombre)}!`;
}

/* ============ Cliente (empresa que arrienda) ============ */
const CLI_ID = 'u3';
VISTAS.cliente = () => {
  const u = usuario(CLI_ID), k = contrato(u.contratoId);
  if (!k || !u.activo) return `<h1>Hola, ${esc(primerNombre(u.nombre))}</h1><div class="tarjeta vacio">No tienes camiones arrendados por ahora.</div>`;
  const ec = estadoContrato(k), cs = camionesDe(k);
  return `
  <div class="fecha-larga">${esc(k.empresa)}</div>
  <h1>Hola, ${esc(primerNombre(u.nombre))}</h1>
  <p class="sec">Aquí ves los camiones que arriendas a ${esc(S.config.empresa)}.</p>
  <section class="tarjeta borde-${ec.e}">
    <div class="titulo-tarjeta"><h2>Tu contrato</h2>${chip(ec.e, ec.txt)}</div>
    <dl class="dl" style="margin:0"><dt>Contrato</dt><dd>${esc(k.numero)}</dd><dt>Vigencia</dt><dd>${fecha(dISO(k.inicio))} al ${fecha(dISO(k.termino))}</dd><dt>Camiones</dt><dd>${cs.length}</dd></dl>
  </section>
  ${cs.map(c => { const rt = estadoRT(c), h = estadoHoras(c), ul = ultima(c); return `<section class="tarjeta">
    <div class="fila entre"><span class="patente">${fmtPatente(c.patente)}</span><span class="sec">${esc(c.tipo)}</span></div>
    <dl class="dl" style="margin-top:.5rem"><dt>Rev. técnica</dt><dd>${fecha(dISO(c.rtVence))}</dd><dt>Horómetro</dt><dd>${n1(h.actual)} h <span class="sec">de ${n0(c.limite)} h</span></dd><dt>Último registro</dt><dd>${ul ? cuando(ul.fecha) : '—'}</dd></dl>
    <div class="barra ${h.e}"><span style="width:${Math.min(100, h.pct)}%"></span></div>
    <div class="chips">${chip(rt.e, 'Rev. técnica: ' + rt.txt)}${chip(h.e, 'Horas: ' + h.txt)}</div>
  </section>`; }).join('')}
  <section class="tarjeta nota">
    <h2>¿Necesitas algo?</h2>
    <p>Contacto de ${esc(S.config.empresa)}: <b>${esc(S.config.telefono)}</b></p>
    ${contactoBotones({ telefono: S.config.telefono, correo: S.config.correo })}
  </section>
  <p class="sec">Vista de solo lectura. Lo que ve el cliente se definirá en detalle más adelante.</p>`;
};

/* ============ Reporte Excel (CSV) ============ */
function exportarCSV() {
  const cab = ['Patente', 'Tipo', 'Modelo', 'Estado arriendo', 'Empresa', 'Contrato vence', 'Horómetro actual', 'Límite horas', '% usado', 'Promedio h/día', 'Fecha límite aprox.', 'Vence rev. técnica', 'Días restantes RT', 'Próxima mantención (h)', 'Horas para mantención', 'Último reporte', 'Estado'];
  const filas = S.camiones.slice().sort(ordenUrgencia).map(c => {
    const h = estadoHoras(c), rt = estadoRT(c), u = ultima(c), k = contrato(c.contratoId);
    return [fmtPatente(c.patente), c.tipo, c.modelo, k ? 'Arrendado' : 'Disponible', k ? k.empresa : '', k ? fecha(dISO(k.termino)) : '', n1(h.actual), c.limite, Math.floor(h.pct), n1(h.prom), h.fechaLim ? fecha(h.fechaLim) : '', fecha(dISO(c.rtVence)), rt.d, estadoMant(c).prox, n0(estadoMant(c).resta), u ? fecha(u.fecha) : '', motivo(c).e === 'ok' ? 'Al día' : `${ETQ[motivo(c).e]}: ${motivo(c).txt}`];
  });
  const csv = '﻿' + [cab, ...filas].map(f => f.map(x => `"${String(x).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `flota-${fecha(Date.now()).replace(/\//g, '-')}.csv`; a.click();
  toast('Reporte descargado');
}

render();
if (REAL) { traerLecturas(); setInterval(traerLecturas, 10000); if (SESION) cargarPerfil(); }
else { $('#banda').textContent = 'Modo de prueba · datos de ejemplo guardados solo en este navegador'; $('#banda').classList.add('local'); } // cada 10 segundos revisa si llegó algo por WhatsApp
