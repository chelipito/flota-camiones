<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Control de Flota · Demostración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --primario:#111111; --acento:#FFC20E; --sobre-acento:#111111; --acento-suave:#FFF4CC; --foco:#2563EB;
  --fondo:#F1F5F9; --tarjeta:#FFFFFF; --texto:#0F172A; --texto-2:#475569; --borde:#CBD5E1;
  --wsp:#128C7E;
  --ok-f:#DCFCE7; --ok-t:#166534;
  --pv-f:#FFEDD5; --pv-t:#9A3412;
  --ur-f:#FEE2E2; --ur-t:#991B1B;
  --sr-f:#E2E8F0; --sr-t:#334155;
  --radio:12px;
  --top-bg:#111111; --top-fg:#FFFFFF; --top-btn:rgba(255,255,255,.12);
  --ancho-menu:260px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:"Source Sans 3",system-ui,sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3{font-family:Lexend,system-ui,sans-serif;line-height:1.25;margin:0 0 .5rem}
h1{font-size:1.5rem} h2{font-size:1.15rem} h3{font-size:1.05rem}
p{margin:0 0 .75rem}
a{color:var(--primario)}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
.num{font-family:Lexend,sans-serif;font-variant-numeric:tabular-nums}
.ico{width:1.25em;height:1.25em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Menú lateral (solo dueño) */
.side{position:fixed;top:0;bottom:0;left:0;width:var(--ancho-menu);background:#111;color:#E5E7EB;display:flex;flex-direction:column;z-index:40;transform:translateX(-100%);overflow-y:auto}
body:not(.con-side) .side{display:none}
body.menu-abierto .side{transform:none}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
body.menu-abierto .scrim{display:block}
.side .logo-side{font-family:Lexend;font-weight:700;letter-spacing:.14em;padding:22px 20px;font-size:1.05rem;color:#fff;text-decoration:none;border-bottom:1px solid #262626;display:block}
.side .logo-side span{color:var(--acento)}
.side .grupo{font-size:.75rem;letter-spacing:.12em;color:#9CA3AF;padding:18px 20px 6px;font-weight:700}
.side a.item-menu{display:flex;align-items:center;gap:.7rem;margin:2px 10px;padding:.6rem .75rem;border-radius:8px;color:#D1D5DB;text-decoration:none;font-weight:600;min-height:44px}
.side a.item-menu:hover{background:#1F1F1F;color:#fff}
.side a.item-menu[aria-current="page"]{background:#262626;color:#fff;box-shadow:inset 3px 0 0 var(--acento)}
.side a.item-menu[aria-current="page"] .ico{color:var(--acento)}
.side .abajo{margin-top:auto;border-top:1px solid #262626;padding:8px 0 12px}
.side .badge{margin-left:auto}
@media (prefers-reduced-motion:no-preference){.side{transition:transform .2s ease-out}}
@media (min-width:900px){
  body.con-side .side{transform:none}
  body.con-side .contenido{margin-left:var(--ancho-menu)}
  body.con-side .btn-menu{display:none}
  body.con-side .scrim{display:none !important}
  body.con-side{--top-bg:#FFFFFF;--top-fg:#111111;--top-btn:rgba(0,0,0,.06)}
  body.con-side .top{border-bottom:1px solid var(--borde)}
  body.con-side .top .marca{display:none}
  body.con-side .migas{display:flex}
  body.con-side .top .avatar{display:grid}
}

/* Barra superior */
.top{position:sticky;top:0;z-index:30;background:var(--top-bg);color:var(--top-fg);padding:.5rem 16px;display:flex;align-items:center;gap:.5rem;min-height:60px}
body:not(.con-side) .top{border-bottom:4px solid var(--acento)}
.top .marca{display:flex;align-items:center;gap:.5rem;font-family:Lexend;font-weight:700;font-size:1.05rem;color:inherit;text-decoration:none;margin-right:auto;min-width:0}
.top .logo{color:var(--acento);width:1.6em;height:1.6em}
.migas{display:none;align-items:center;gap:.5rem;font-size:.85rem;font-weight:600;margin-right:auto}
.migas .seccion-marca{font-weight:700;letter-spacing:.12em;background:var(--acento);color:#111;padding:.1rem .45rem;border-radius:4px}
.top .volver{display:inline-flex;align-items:center;gap:.3rem;min-height:44px;padding:0 .7rem 0 .4rem;border:0;border-radius:8px;background:var(--top-btn);color:inherit;font-weight:600;cursor:pointer}
.top .volver .ico{width:1.4em;height:1.4em}
.top .btn-ico{width:44px;height:44px;border:0;background:transparent;color:inherit;display:grid;place-items:center;border-radius:8px;position:relative;cursor:pointer;flex:none}
.top .btn-ico .ico{width:24px;height:24px}
.top .contador{position:absolute;top:3px;right:1px;background:#DC2626;color:#fff;font-size:.7rem;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;line-height:1}
.top .avatar{display:none}
.pill{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;padding:.2rem .65rem;font-size:.85rem;font-weight:600;white-space:nowrap}
.top .pill{background:var(--top-btn);color:inherit}
.top .pill.off{background:#FDE68A;color:#78350F}
@media (max-width:480px){.top .volver:not([hidden]) ~ .marca .marca-txt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
.demo-banda{background:var(--acento);color:var(--sobre-acento);text-align:center;font-size:.85rem;padding:.3rem 16px;font-weight:600}
body.con-side .demo-banda{background:var(--acento-suave)}

main{max-width:1120px;margin:0 auto;padding:20px 16px 48px}
.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:var(--radio);padding:16px;margin-bottom:12px}
.fila{display:flex;align-items:center;gap:.75rem}
.entre{justify-content:space-between}
.sec{color:var(--texto-2);font-size:.95rem}
.grid{display:grid;gap:12px}
@media (min-width:720px){.grid-2{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:repeat(3,1fr)}}
.grid-inicio{display:grid;gap:16px;align-items:start}
@media (min-width:960px){.grid-inicio{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}}
.cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.cab h1{margin:0}
.fecha-larga{color:var(--texto-2);font-size:.9rem;margin-bottom:.2rem}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:48px;padding:.6rem 1.1rem;border-radius:10px;border:2px solid var(--primario);background:#fff;color:var(--primario);font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn.pri{background:var(--primario);color:#fff}
.btn.cta{background:var(--acento);border-color:var(--primario);color:var(--sobre-acento)}
.btn.wsp{background:var(--wsp);border-color:var(--wsp);color:#fff}
.btn.peligro{border-color:var(--ur-t);color:var(--ur-t)}
.btn.grande{min-height:60px;font-size:1.15rem;width:100%}
.btn.chico{min-height:40px;padding:.35rem .8rem;font-size:.95rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.txt{border-color:transparent;background:transparent;padding-left:.25rem;padding-right:.25rem}
.acciones{display:flex;flex-wrap:wrap;gap:10px}

/* Semáforo y chips */
.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:8px;padding:.2rem .6rem;font-weight:600;font-size:.9rem;white-space:nowrap}
.chip.ok{background:var(--ok-f);color:var(--ok-t)}
.chip.porvencer{background:var(--pv-f);color:var(--pv-t)}
.chip.urgente,.chip.vencido{background:var(--ur-f);color:var(--ur-t)}
.chip.sinreporte{background:var(--sr-f);color:var(--sr-t)}
.chip.arrendado{background:#111;color:var(--acento)}
.chip.disponible{background:#fff;color:#111;box-shadow:inset 0 0 0 2px #111}
.chip.rol{background:var(--acento-suave);color:#111}
.borde-urgente,.borde-vencido{border-left:6px solid var(--ur-t)}
.borde-porvencer{border-left:6px solid #C2410C}
.borde-sinreporte{border-left:6px solid var(--sr-t)}
.borde-ok{border-left:6px solid var(--ok-t)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

/* KPIs */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media (min-width:720px){.kpis{grid-template-columns:repeat(4,1fr)}.kpis.k3{grid-template-columns:repeat(3,1fr)}}
.kpi{border-radius:var(--radio);padding:14px;border:1px solid var(--borde);background:#fff;text-align:left;display:block;width:100%;color:inherit;text-decoration:none}
a.kpi{cursor:pointer}
.kpi .n{font-family:Lexend;font-size:2rem;font-weight:700;line-height:1}
.kpi .l{display:flex;align-items:center;gap:.35rem;font-weight:600;margin-top:.35rem}
.kpi.ok{background:var(--ok-f);color:var(--ok-t)} .kpi.porvencer{background:var(--pv-f);color:var(--pv-t)}
.kpi.urgente{background:var(--ur-f);color:var(--ur-t)} .kpi.sinreporte{background:var(--sr-f);color:var(--sr-t)}
.kpi.marca{background:#111;color:#fff} .kpi.marca .ico{color:var(--acento)}

/* Listas */
.item{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}
.item .cuerpo{flex:1;min-width:0}
.patente{font-family:Lexend;font-weight:700;font-size:1.2rem;letter-spacing:.04em;text-decoration:none;color:inherit}
.aviso-fila{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--borde);color:inherit;text-decoration:none}
.aviso-fila:first-child{border-top:0}
.aviso-fila .cuerpo{flex:1;min-width:0;display:flex;flex-direction:column}
.tipo{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--texto-2)}
.chip-ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.chip-ico.ok{background:var(--ok-f);color:var(--ok-t)} .chip-ico.porvencer{background:var(--pv-f);color:var(--pv-t)}
.chip-ico.urgente,.chip-ico.vencido{background:var(--ur-f);color:var(--ur-t)} .chip-ico.sinreporte{background:var(--sr-f);color:var(--sr-t)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:.3rem 1rem;margin:0 0 .5rem}
.dl dt{color:var(--texto-2)} .dl dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.persona{display:flex;gap:12px;align-items:flex-start}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--acento);color:#111;display:grid;place-items:center;font-family:Lexend;font-weight:700;font-size:.9rem;flex:none}
.titulo-tarjeta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:.5rem}
.titulo-tarjeta h2{margin:0}
.ver-todo{font-weight:600;text-decoration:none;white-space:nowrap}

/* Barras */
.barra{height:14px;border-radius:7px;background:#E2E8F0;overflow:hidden;margin:.4rem 0}
.barra > span{display:block;height:100%;background:var(--ok-t)}
.barra.porvencer > span{background:#C2410C} .barra.urgente > span,.barra.vencido > span{background:var(--ur-t)}
.barra.marca > span{background:#111}

/* Formularios */
label.campo{display:block;font-weight:600;margin-bottom:12px}
label.campo input,label.campo select,label.campo textarea{display:block;width:100%;margin-top:.3rem;min-height:48px;padding:.5rem .75rem;border:2px solid var(--borde);border-radius:10px;background:#fff;color:var(--texto)}
fieldset{border:1px solid var(--borde);border-radius:10px;padding:12px;margin:0 0 12px}
legend{font-weight:700;padding:0 .3rem}
.check{display:flex;align-items:center;gap:.6rem;min-height:44px;font-weight:600;cursor:pointer}
.check input{width:22px;height:22px;accent-color:#111;flex:none}
.input-grande{font-family:Lexend;font-size:2rem !important;text-align:center;min-height:72px !important;font-variant-numeric:tabular-nums}
.error{color:var(--ur-t);background:var(--ur-f);border-radius:8px;padding:.6rem .8rem;font-weight:600;margin:.5rem 0}
.ayuda{color:var(--texto-2);font-size:.92rem;font-weight:400}

/* Empleado: letra más grande */
.vista-op{font-size:18px}
.paso{display:inline-block;font-weight:700;background:var(--acento);color:var(--sobre-acento);border-radius:6px;padding:.1rem .6rem;font-family:Lexend;margin-bottom:.4rem}
.foto-prev{width:100%;max-height:260px;object-fit:contain;border-radius:10px;border:1px solid var(--borde);background:#0F172A}
.listo{text-align:center;padding:24px 8px}
.listo .circulo{width:96px;height:96px;border-radius:50%;background:var(--ok-f);color:var(--ok-t);display:grid;place-items:center;margin:0 auto 16px}
.listo .circulo .ico{width:56px;height:56px}

/* Tabla */
.tabla-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:.5rem .4rem;border-bottom:1px solid var(--borde);vertical-align:middle}
th{color:var(--texto-2);font-weight:600}
.mini-foto{width:48px;height:36px;object-fit:cover;border-radius:6px;background:#0F172A}

/* Ficha tipo Word */
.papel{background:#fff;max-width:820px;margin:0 auto;padding:40px 44px;border:1px solid var(--borde);box-shadow:0 6px 24px rgba(0,0,0,.08)}
@media (max-width:600px){.papel{padding:20px 14px}}
.papel table td,.papel table th{overflow-wrap:anywhere;border-bottom:none}

.burbuja{background:#E7FFDB;border-radius:12px;padding:12px 14px;white-space:pre-wrap;font-size:.95rem;border:1px solid #BBE5A7;overflow-wrap:anywhere}

/* Elegir perfil */
.perfil{display:flex;gap:14px;align-items:flex-start;color:inherit;cursor:pointer;width:100%;text-align:left;font:inherit}
.perfil .ic{width:52px;height:52px;border-radius:12px;background:var(--primario);color:var(--acento);display:grid;place-items:center;flex:none}
.perfil .ic .ico{width:28px;height:28px}
.pasos{counter-reset:p;list-style:none;padding:0;margin:0}
.pasos li{counter-increment:p;display:flex;gap:12px;margin-bottom:12px}
.pasos li::before{content:counter(p);flex:none;width:32px;height:32px;border-radius:50%;background:var(--acento);color:var(--sobre-acento);display:grid;place-items:center;font-family:Lexend;font-weight:700}

.badge{background:#DC2626;color:#fff;border-radius:999px;font-size:.72rem;padding:0 .45rem;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--texto);color:#fff;padding:.7rem 1.1rem;border-radius:10px;font-weight:600;z-index:50;max-width:calc(100% - 32px);text-align:center}
.vacio{text-align:center;color:var(--texto-2);padding:24px}
.filtros{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.filtros .btn{flex:none}
.filtros .btn[aria-pressed="true"]{background:var(--primario);color:#fff}
.graf{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:8px}
.graf span{flex:1;background:var(--primario);border-radius:3px 3px 0 0;min-height:2px}
.graf-ejes{display:flex;justify-content:space-between;color:var(--texto-2);font-size:.8rem}
.nota{background:var(--acento-suave);border-color:var(--acento)}

/* Simulación de WhatsApp */
.chat{display:flex;flex-direction:column;height:min(680px,calc(100dvh - 200px));min-height:420px;max-width:520px;margin:0 auto;border:1px solid var(--borde);border-radius:var(--radio);overflow:hidden;background:#ECE5DD}
.chat-cab{background:#075E54;color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center}
.chat-cab .avatar{background:var(--acento);color:#111}
.chat-cab small{display:block;opacity:.85}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:85%;padding:6px 10px 4px;border-radius:8px;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.12);overflow-wrap:anywhere;font-size:16px;line-height:1.4}
.msg.yo{align-self:flex-end;background:#DCF8C6}
.msg.bot{align-self:flex-start;background:#fff}
.msg .t{display:block;text-align:right;font-size:.72rem;color:#54656F;margin-top:2px}
.msg img{display:block;max-width:200px;width:100%;border-radius:6px;margin-bottom:4px}
.msg-dia{align-self:center;background:#E1F2FB;color:#334155;font-size:.8rem;border-radius:6px;padding:.15rem .6rem}
.chat-sug{display:flex;gap:6px;overflow-x:auto;padding:8px 8px 0;background:#F0F2F5}
.chat-sug button{flex:none;border:1px solid var(--borde);background:#fff;color:var(--texto);border-radius:999px;padding:.3rem .8rem;min-height:38px;cursor:pointer;font-weight:600}
.chat-input{display:flex;gap:6px;padding:8px;background:#F0F2F5;align-items:center}
.chat-input input[type=text]{flex:1;min-width:0;min-height:46px;border-radius:999px;border:1px solid var(--borde);padding:0 14px;font-size:16px;background:#fff}
.redondo{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;flex:none;background:transparent;color:#54656F}
.redondo.enviar{background:#128C7E;color:#fff}
.redondo .ico{width:22px;height:22px}
@media (prefers-reduced-motion:no-preference){.btn,.kpi{transition:filter .15s}.btn:hover,.kpi:hover{filter:brightness(.95)}}
@media print{.side,.scrim,.top,.demo-banda,.no-print{display:none !important}body.con-side .contenido{margin-left:0}main{padding:0}.tarjeta{break-inside:avoid}.papel{border:0;box-shadow:none;padding:0}}
</style>
</head>
<body>
<aside class="side" id="side" aria-label="Menú principal"></aside>
<div class="scrim" onclick="cerrarMenu()"></div>
<div class="contenido">
  <header class="top">
    <button class="btn-ico btn-menu" id="btnMenu" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="side" onclick="abrirMenu()" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-menu"/></svg></button>
    <button id="btnVolver" class="volver" type="button" onclick="volverAtras()" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-back"/></svg>Volver</button>
    <a class="marca" id="marca" href="#perfil"><svg class="ico logo" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-truck"/></svg><span class="marca-txt">Control de Flota</span></a>
    <div class="migas" id="migas"></div>
    <span id="estadoRed" class="pill"></span>
    <a class="btn-ico" id="campana" href="#avisos" hidden></a>
    <span class="avatar" id="avatar" aria-hidden="true"></span>
  </header>
  <div class="demo-banda">Demostración · datos de ejemplo · versión 5</div>
  <main id="app"></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<!-- Iconos (estilo Lucide) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-truck" viewBox="0 0 24 24"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></symbol>

<script>
'use strict';
/* ============ Utilidades ============ */
const DIA = 86400000;
const $ = (s, el = document) => el.querySelector(s);
const ic = id => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n0 = v => Math.round(v).toLocaleString('es-CL');
const n1 = v => Number(v).toLocaleString('es-CL', { maximumFractionDigits: 1 });
const pad = v => String(v).padStart(2, '0');
const hoy0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const isoLocal = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const dISO = s => s + 'T12:00'; // fecha 'AAAA-MM-DD' a mediodía local, para no correr el día por zona horaria
const fecha = d => new Date(d).toLocaleDateString('es-CL', { day: '2-digit', month: '2-digit', year: 'numeric' });
const fechaCorta = d => new Date(d).toLocaleDateString('es-CL', { day: '2-digit', month: '2-digit' });
const hora = d => new Date(d).toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', hour12: false });
const diasHasta = d => Math.round((new Date(d).setHours(0, 0, 0, 0) - hoy0()) / DIA);
const fmtPatente = p => String(p).toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/^([A-Z]{2})([A-Z0-9]{2})([0-9]{2})$/, '$1·$2·$3');
const iniciales = n => String(n).split(' ').filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase();
const primerNombre = n => String(n).split(' ')[0];
function fechaLarga() { const s = new Date().toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' }); return s[0].toUpperCase() + s.slice(1); }
function saludo() { const h = new Date().getHours(); return h < 12 ? 'Buenos días' : h < 20 ? 'Buenas tardes' : 'Buenas noches'; }
function cuando(d) {
  const dd = -diasHasta(d);
  if (dd === 0) return 'hoy ' + hora(d);
  if (dd === 1) return 'ayer ' + hora(d);
  return 'hace ' + dd + ' días';
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200);
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* Foto de ejemplo: dibujo de un horómetro con la lectura */
function fotoEjemplo(valor) {
  const txt = n1(valor).padStart(7, ' ');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200"><rect width="320" height="200" fill="#1f2937"/><rect x="30" y="40" width="260" height="120" rx="14" fill="#0b0f14" stroke="#64748b" stroke-width="4"/><text x="160" y="72" fill="#94a3b8" font-family="Arial" font-size="16" text-anchor="middle">HORAS</text><text x="160" y="130" fill="#fbbf24" font-family="Courier New,monospace" font-size="44" font-weight="bold" text-anchor="middle">${txt}</text></svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

/* ============ Datos de ejemplo ============ */
const CLAVE = 'flota-demo-v3';
function crearDemo() {
  const r = rng(7);
  const base = hoy0().getTime();
  const enDias = d => isoLocal(base + d * DIA);
  const usuarios = [
    { id: 'u0', nombre: 'Felipe', correo: 'dueno@ejemplo.cl', telefono: '+56 9 0000 0000', rol: 'dueno', activo: true, acceso: Date.now() },
    { id: 'u1', nombre: 'Juan Pérez', correo: 'juan.perez@ejemplo.cl', telefono: '+56 9 0000 0011', rol: 'empleado', activo: true, acceso: base - DIA + 17 * 3600000 },
    { id: 'u2', nombre: 'Luis Soto', correo: 'luis.soto@ejemplo.cl', telefono: '+56 9 0000 0012', rol: 'empleado', activo: true, acceso: base - DIA + 18 * 3600000 },
    { id: 'u3', nombre: 'Pablo Contreras', correo: 'pcontreras@andessur.ejemplo', telefono: '+56 9 0000 0001', rol: 'cliente', contratoId: 'k1', activo: true, acceso: base - 3 * DIA },
    { id: 'u4', nombre: 'Carla Muñoz', correo: 'cmunoz@cerroalto.ejemplo', telefono: '+56 9 0000 0002', rol: 'cliente', contratoId: 'k2', activo: false, acceso: null }
  ];
  const contratos = [
    { id: 'k1', numero: 'CT-2026-014', empresa: 'Constructora Andes Sur', rut: '76.000.000-1', faena: 'Obra Ruta 5, km 210', inicio: enDias(-340), termino: enDias(25),
      admin: { nombre: 'Pablo Contreras', cargo: 'Administrador de contrato', telefono: '+56 9 0000 0001', correo: 'pcontreras@andessur.ejemplo' },
      notas: 'Arriendo con operador. La mantención es responsabilidad del arrendador.' },
    { id: 'k2', numero: 'CT-2026-021', empresa: 'Minera Cerro Alto', rut: '77.000.000-2', faena: 'Faena Cerro Alto, sector norte', inicio: enDias(-120), termino: enDias(245),
      admin: { nombre: 'Carla Muñoz', cargo: 'Jefa de contrato', telefono: '+56 9 0000 0002', correo: 'cmunoz@cerroalto.ejemplo' },
      notas: 'Arriendo sin operador. Reporte de horómetro diario.' }
  ];
  // [patente, tipo, modelo, empleado que registra, límite h, % usado, días a la RT, días sin registro, contrato]
  // Un caso por camión: RT vencida, disponible con RT y horas por vencer, horas urgentes, sin reporte y al día
  const defs = [
    ['KDLP21', 'Camión tolva', 'Volvo FMX 460', 'u1', 12000, 0.62, -3, 1, 'k1'],
    ['JHRT45', 'Camión aljibe', 'Mercedes-Benz Actros', '', 10000, 0.86, 18, 2, null],
    ['GFTS12', 'Camión tolva', 'Volvo FMX 460', 'u2', 10000, 0.963, 120, 1, 'k2'],
    ['PRDW77', 'Camión rampla', 'Scania G410', 'u1', 12000, 0.41, 210, 4, 'k1'],
    ['KTVB09', 'Camión tolva', 'Volvo FMX 460', '', 12000, 0.35, 95, 2, null]
  ];
  const camiones = defs.map((d, i) => {
    const [patente, tipo, modelo, operador, limite, pct, diasRT, sinReg, contratoId] = d;
    const uso = 7 + r() * 4; // horas de motor promedio por día hábil
    const incs = [];
    for (let k = 30; k >= sinReg; k--) {
      const f = new Date(base - k * DIA);
      if (!contratoId && (30 - k) % 7) continue; // disponibles: un registro semanal, casi sin uso
      const h = !contratoId ? Math.round(r() * 8) / 10 : f.getDay() === 0 ? 0 : Math.round(uso * (0.7 + r() * 0.5) * 10) / 10;
      incs.push({ f: f.getTime() + (17 * 60 + Math.floor(r() * 120)) * 60000, h });
    }
    const total = incs.reduce((s, x) => s + x.h, 0);
    let valor = Math.round((limite * pct - total) * 10) / 10;
    const lecturas = incs.map((x, j) => {
      valor = Math.round((valor + x.h) * 10) / 10;
      const ultima = j === incs.length - 1;
      return { id: 'l' + i + '-' + j, fecha: x.f, valor, usuario: operador || 'u0', foto: true,
        estado: ultima && contratoId && i % 3 !== 0 ? 'pendiente' : 'validado', sync: 'enviado' };
    });
    if (i === 2) { const l = lecturas[lecturas.length - 2]; l.estado = 'observado'; l.nota = 'La foto está borrosa, no se lee el número.'; }
    return { id: 'c' + (i + 1), patente, tipo, modelo, operador, limite, contratoId, rtVence: enDias(diasRT), lecturas };
  });
  return {
    creado: Date.now(), rol: 'dueno', sinSenalDemo: false,
    config: { empresa: 'Transportes Ejemplo', telefono: '+56 9 0000 0000', wsp: '', correo: '',
      diasPorVencer: 30, diasUrgente: 7, pctAviso: 80, pctUrgente: 95, diasSinReporte: 2, diasContratoAviso: 60, diasContratoUrgente: 15 },
    usuarios, contratos, camiones
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(CLAVE)); } catch (e) { S = null; }
if (!S || !S.camiones) S = crearDemo();
if (!S.rol) S.rol = 'dueno'; // la app abre directo en la vista del dueño
function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(S)); } catch (e) { /* sin almacenamiento: la demo funciona igual en memoria */ } }

/* ============ Reglas de negocio ============ */
const usuario = id => S.usuarios.find(u => u.id === id) || { nombre: '—' };
const dueno = () => S.usuarios.find(u => u.rol === 'dueno') || { nombre: '' };
const camion = id => S.camiones.find(c => c.id === id);
const contrato = id => S.contratos.find(k => k.id === id);
const camionesDe = k => S.camiones.filter(c => c.contratoId === k.id);
const lecturasOk = c => c.lecturas.filter(l => l.sync === 'enviado');
const ultima = (c, todas) => { const ls = todas ? c.lecturas : lecturasOk(c); return ls[ls.length - 1]; };
const RANGO = { vencido: 4, urgente: 3, porvencer: 2, sinreporte: 1, ok: 0 };
const ETQ = { ok: 'Al día', porvencer: 'Por vencer', urgente: 'Urgente', vencido: 'Vencido', sinreporte: 'Sin reporte' };
const ICO = { ok: 'check', porvencer: 'clock', urgente: 'alert', vencido: 'alert', sinreporte: 'wifi-off' };
const ROL = { dueno: 'Dueño', empleado: 'Empleado', cliente: 'Cliente' };
const nCam = n => n === 1 ? "1 camión" : n + " camiones";
const chip = (e, txt) => `<span class="chip ${e}">${ic(ICO[e])}${esc(txt)}</span>`;

function estadoPlazo(d, urgente, aviso) {
  let e = 'ok', txt = `Vence en ${d} días`;
  if (d < 0) { e = 'vencido'; txt = `Venció hace ${-d} ${-d === 1 ? 'día' : 'días'}`; }
  else if (d === 0) { e = 'vencido'; txt = 'Vence hoy'; }
  else if (d <= urgente) e = 'urgente';
  else if (d <= aviso) e = 'porvencer';
  if (d === 1) txt = 'Vence mañana';
  return { e, d, txt };
}
const estadoRT = c => estadoPlazo(diasHasta(dISO(c.rtVence)), S.config.diasUrgente, S.config.diasPorVencer);
const estadoContrato = k => estadoPlazo(diasHasta(dISO(k.termino)), S.config.diasContratoUrgente, S.config.diasContratoAviso);
function promedioDiario(c) {
  const ls = lecturasOk(c); if (ls.length < 2) return 0;
  const desde = Date.now() - 14 * DIA;
  const rec = ls.filter(l => l.fecha >= desde);
  const a = rec.length ? ls[Math.max(0, ls.indexOf(rec[0]) - 1)] : ls[0];
  const b = ls[ls.length - 1];
  return (b.valor - a.valor) / Math.max(1, (b.fecha - a.fecha) / DIA);
}
function estadoHoras(c) {
  const u = ultima(c); const actual = u ? u.valor : 0;
  const pct = actual / c.limite * 100;
  const prom = promedioDiario(c);
  const resta = c.limite - actual;
  const dias = prom >= 0.5 ? Math.ceil(resta / prom) : null; // con menos de media hora diaria no se proyecta
  let e = 'ok';
  if (pct >= 100) e = 'vencido'; else if (pct >= S.config.pctUrgente) e = 'urgente'; else if (pct >= S.config.pctAviso) e = 'porvencer';
  const fechaLim = dias != null ? new Date(Date.now() + dias * DIA) : null;
  return { e, actual, pct, prom, resta, dias, fechaLim, txt: pct >= 100 ? 'Límite superado' : `${Math.floor(pct)}% del límite` };
}
function sinReporte(c) {
  if (!c.contratoId) return { si: false, dias: null }; // un camión disponible no trabaja: no se le exige reporte
  const u = ultima(c); if (!u) return { si: true, dias: null };
  const dias = -diasHasta(u.fecha);
  return { si: dias > S.config.diasSinReporte, dias };
}
function estadoGeneral(c) {
  const a = estadoRT(c).e, b = estadoHoras(c).e;
  let e = RANGO[a] >= RANGO[b] ? a : b;
  if (e === 'ok' && sinReporte(c).si) e = 'sinreporte';
  return e;
}
const ordenUrgencia = (a, b) => RANGO[estadoGeneral(b)] - RANGO[estadoGeneral(a)] || estadoRT(a).d - estadoRT(b).d;
const porValidar = () => S.camiones.reduce((s, c) => s + lecturasOk(c).filter(l => l.estado === 'pendiente').length, 0);

/* Todo lo que requiere atención del dueño, del más urgente al menos urgente */
function itemsAtencion() {
  const xs = [];
  S.contratos.forEach(k => {
    const ec = estadoContrato(k);
    if (ec.e !== 'ok') xs.push({ tipo: 'Contrato', e: ec.e, titulo: k.empresa, detalle: `${ec.txt} (${fecha(dISO(k.termino))}) · conviene renegociar`,
      msg: `${k.empresa}: contrato ${ec.txt.toLowerCase()} (${fechaCorta(dISO(k.termino))})`, href: '#contrato/' + k.id });
  });
  S.camiones.forEach(c => {
    const p = fmtPatente(c.patente), rt = estadoRT(c), h = estadoHoras(c), s = sinReporte(c);
    if (rt.e !== 'ok') xs.push({ tipo: 'Revisión técnica', e: rt.e, titulo: p, detalle: `${rt.txt} (${fecha(dISO(c.rtVence))})`,
      msg: `${p} (${c.tipo}): ${rt.e === 'vencido' ? rt.txt.toUpperCase() : rt.txt.toLowerCase() + ' (' + fechaCorta(dISO(c.rtVence)) + ')'}`, href: '#camion/' + c.id });
    if (h.e !== 'ok') xs.push({ tipo: 'Horómetro', e: h.e, titulo: p, detalle: h.txt + (h.pct < 100 && h.fechaLim ? ` · llega al límite aprox. el ${fecha(h.fechaLim)}` : ''),
      msg: `${p} (${c.tipo}): ${Math.floor(h.pct)}% del límite${h.pct < 100 && h.fechaLim ? ', lo alcanza aprox. el ' + fechaCorta(h.fechaLim) : ''}`, href: '#camion/' + c.id });
    if (s.si) xs.push({ tipo: 'Sin reporte', e: 'sinreporte', titulo: p, detalle: `${s.dias} días sin registrar horómetro`, msg: `${p}: ${s.dias} días sin registrar horómetro`, href: '#camion/' + c.id });
  });
  return xs.sort((a, b) => RANGO[b.e] - RANGO[a.e]);
}

/* ============ Red / sin señal ============ */
const enLinea = () => navigator.onLine && !S.sinSenalDemo;
function pintarRed() {
  const el = $('#estadoRed');
  const cola = S.camiones.reduce((s, c) => s + c.lecturas.filter(l => l.sync === 'cola').length, 0);
  if (enLinea()) { el.className = 'pill'; el.innerHTML = ic('wifi') + 'En línea'; }
  else { el.className = 'pill off'; el.innerHTML = ic('wifi-off') + 'Sin señal' + (cola ? ` (${cola})` : ''); }
  el.title = cola ? `${cola} registros por enviar` : '';
}
function sincronizar() {
  if (!enLinea()) return;
  let n = 0;
  S.camiones.forEach(c => c.lecturas.forEach(l => { if (l.sync === 'cola') { l.sync = 'enviado'; n++; } }));
  if (n) { guardar(); toast(`Volvió la señal: ${n === 1 ? 'se envió 1 registro' : `se enviaron ${n} registros`}`); }
  pintarRed();
}
addEventListener('online', () => { sincronizar(); render(); });
addEventListener('offline', () => { pintarRed(); render(); });

/* ============ Navegación ============ */
const MENU = [
  ['inicio', 'home', 'Inicio'], ['flota', 'truck', 'Flota'], ['contratos', 'file', 'Contratos'],
  ['revisiones', 'shield', 'Revisiones técnicas'], ['horometros', 'gauge', 'Horómetros'],
  ['avisos', 'bell', 'Avisos'], ['usuarios', 'users', 'Usuarios y accesos']
];
const SECCION = { wsp: 'horometros', camion: 'flota', editar: 'flota', contrato: 'contratos', ficha: 'contratos', 'editar-contrato': 'contratos', 'editar-usuario': 'usuarios' };
const TITULO = Object.fromEntries([...MENU.map(m => [m[0], m[2]]), ['ajustes', 'Configuración'], ['perfil', 'Ver como otro perfil']]);
const HOME = { dueno: 'inicio', empleado: 'empleado', cliente: 'cliente' };
const PERMISOS = { empleado: ['empleado', 'registrar', 'wsp'], cliente: ['cliente'] }; // el dueño ve todo menos las vistas de los otros perfiles (el chat de prueba sí)
function permitido(rol, r) { return rol === 'dueno' ? !['empleado', 'registrar', 'cliente'].includes(r) : PERMISOS[rol].includes(r); }
function leerRuta() {
  const [path, qs = ''] = location.hash.slice(1).split('?');
  const [r, arg] = path.split('/');
  return { r, arg, q: new URLSearchParams(qs) };
}
function padre(r, arg) {
  switch (r) {
    case 'perfil': return HOME[S.rol];
    case 'empleado': case 'cliente': return 'perfil';
    case 'registrar': return 'empleado';
    case 'wsp': return S.rol === 'dueno' ? 'horometros' : 'empleado';
    case 'camion': return 'flota';
    case 'contrato': return 'contratos';
    case 'ficha': return 'contrato/' + arg;
    case 'editar-contrato': return arg === 'nuevo' ? 'contratos' : 'contrato/' + arg;
    case 'editar': return arg === 'nuevo' ? 'flota' : 'camion/' + arg;
    case 'editar-usuario': return 'usuarios';
    default: return 'inicio';
  }
}
function pintarMenu(r) {
  const base = SECCION[r] || r;
  const pend = porValidar(), avisos = itemsAtencion().length;
  const item = ([k, i, t]) => `<a class="item-menu" href="#${k}" ${base === k ? 'aria-current="page"' : ''}>${ic(i)}<span>${t}</span>${k === 'horometros' && pend ? `<span class="badge">${pend}</span>` : k === 'avisos' && avisos ? `<span class="badge">${avisos}</span>` : ''}</a>`;
  $('#side').innerHTML = `
    <a class="logo-side" href="#inicio">${esc(S.config.empresa.toUpperCase())}<span>.</span></a>
    <div class="grupo">FLOTA</div>
    ${MENU.map(item).join('')}
    <div class="abajo">
      ${item(['ajustes', 'sliders', 'Configuración'])}
      <a class="item-menu" href="#perfil" ${r === 'perfil' ? 'aria-current="page"' : ''}>${ic('repeat')}<span>Ver como empleado o cliente</span></a>
    </div>`;
  const n = avisos;
  const camp = $('#campana');
  camp.innerHTML = ic('bell') + (n ? `<span class="contador">${n}</span>` : '');
  camp.setAttribute('aria-label', `Avisos: ${n} por revisar`);
  $('#avatar').textContent = iniciales(dueno().nombre);
  $('#migas').innerHTML = `<span class="seccion-marca">FLOTA</span><span aria-hidden="true">›</span><span>${esc(TITULO[base] || '')}</span>`;
}
function abrirMenu() { document.body.classList.add('menu-abierto'); $('#btnMenu').setAttribute('aria-expanded', 'true'); $('#side a').focus(); }
function cerrarMenu() { document.body.classList.remove('menu-abierto'); $('#btnMenu').setAttribute('aria-expanded', 'false'); }
addEventListener('keydown', e => { if (e.key === 'Escape') cerrarMenu(); });

const VISTAS = {};
function render() {
  let { r, arg, q } = leerRuta();
  if (!r) r = HOME[S.rol];
  else if (r !== 'perfil' && (!VISTAS[r] || !permitido(S.rol, r))) r = HOME[S.rol];
  const conSide = S.rol === 'dueno';
  document.body.classList.toggle('con-side', conSide);
  const app = $('#app');
  app.className = (r === 'empleado' || r === 'registrar') ? 'vista-op' : '';
  app.innerHTML = VISTAS[r](arg, q);
  $('#btnMenu').hidden = !conSide;
  $('#campana').hidden = !conSide;
  $('#btnVolver').hidden = S.rol === 'dueno' && r === 'inicio'; // en el inicio del dueño no hay a dónde volver
  $('#marca').href = '#' + HOME[S.rol];
  if (conSide) pintarMenu(r);
  pintarRed();
  const cm = $('#chatMsgs');
  if (cm) { cm.scrollTop = cm.scrollHeight; if (CHAT_TECLADO) $('#chatTxt').focus({ preventScroll: true }); }
  const h = app.querySelector('h1'); if (h && render.mover) { h.tabIndex = -1; h.focus({ preventScroll: true }); }
  render.mover = false;
}
// Botón Volver: vuelve a la pantalla anterior; si se entró por un link directo, sube un nivel
let pila = [location.hash || '#' + HOME[S.rol]];
let REG = null;
addEventListener('hashchange', () => {
  const h = location.hash || '#' + HOME[S.rol];
  if (pila[pila.length - 1] !== h) { if (pila[pila.length - 2] === h) pila.pop(); else pila.push(h); }
  if (leerRuta().r !== 'registrar') REG = null;
  cerrarMenu(); render.mover = true; scrollTo(0, 0); render();
});
function volverAtras() {
  if (pila.length > 1) { pila.pop(); location.hash = pila[pila.length - 1]; return; }
  const { r, arg } = leerRuta();
  const p = '#' + padre(r || HOME[S.rol], arg); pila = [p]; location.hash = p;
}
function ir(h) { location.hash = h; }

/* ============ Componentes ============ */
const kpi = (cls, n, t, i, href) => `<${href ? `a href="${href}"` : 'div'} class="kpi ${cls}"><div class="n num">${n}</div><div class="l">${ic(i)}${t}</div></${href ? 'a' : 'div'}>`;
const chipArriendo = c => c.contratoId ? `<span class="chip arrendado">${ic('building')}Arrendado</span>` : `<span class="chip disponible">${ic('check')}Disponible</span>`;
function contactoBotones(p) {
  const tel = (p.telefono || '').replace(/[^\d+]/g, '');
  return `<div class="acciones no-print">
    ${tel ? `<a class="btn chico" href="tel:${tel}">${ic('phone')}Llamar</a><a class="btn chico wsp" target="_blank" rel="noopener" href="https://wa.me/${tel.replace(/\D/g, '')}">${ic('send')}WhatsApp</a>` : ''}
    ${p.correo ? `<a class="btn chico" href="mailto:${esc(p.correo)}">${ic('mail')}Correo</a>` : ''}</div>`;
}
const filaAtencion = it => `<a class="aviso-fila" href="${it.href}"><span class="chip-ico ${it.e}">${ic(ICO[it.e])}</span>
  <span class="cuerpo"><span class="tipo">${esc(it.tipo)}</span><b>${esc(it.titulo)}</b><span class="sec">${esc(it.detalle)}</span></span>${ic('chevron')}</a>`;
function filaCamion(c) {
  const g = estadoGeneral(c), rt = estadoRT(c), h = estadoHoras(c), sr = sinReporte(c), k = contrato(c.contratoId);
  return `<a class="tarjeta item borde-${g}" href="#camion/${c.id}">
    <div class="cuerpo">
      <div class="fila entre" style="flex-wrap:wrap;gap:6px"><span class="patente">${fmtPatente(c.patente)}</span>${chipArriendo(c)}</div>
      <div class="sec">${esc(c.tipo)} · ${esc(c.modelo)}</div>
      ${k ? `<div class="sec"><b>${esc(k.empresa)}</b> · hasta ${fecha(dISO(k.termino))}</div>` : ''}
      <div class="chips">
        ${chip(rt.e, 'Rev. técnica: ' + rt.txt)}
        ${chip(h.e, 'Horas: ' + h.txt)}
        ${sr.si ? chip('sinreporte', `${sr.dias} días sin reporte`) : ''}
      </div>
    </div>${ic('chevron')}</a>`;
}

/* ============ Vista: Elegir perfil (demo) ============ */

  const p = (rol, i, t, d) => `<button class="tarjeta perfil" onclick="elegirRol('${rol}')"><span class="ic">${ic(i)}</span><span><h2>${t}</h2><span class="sec">${d}</span></span></button>`;
  return `
  <h1>Ver la app como otro perfil</h1>
  <p class="sec">Solo para la demostración: elige un perfil para ver la app como la vería cada persona. Para volver a tu vista, elige <b>Dueño</b>.</p>
  <div class="grid grid-3">
    ${p('dueno', 'building', 'Dueño', 'Ve y administra todo: flota, contratos, revisiones técnicas, horómetros y quién tiene acceso.')}
    ${p('empleado', 'user', 'Empleado', 'Registra el horómetro de los camiones arrendados con una foto, incluso sin señal.')}
    ${p('cliente', 'users', 'Cliente', 'La empresa que arrienda ve solo sus camiones y su contrato.')}
  </div>
  <div class="tarjeta">
    <h2>Cómo funciona</h2>
    <ol class="pasos">
      <li><span><b>El dueño registra la flota y los contratos de arriendo</b>: con qué empresa, hasta cuándo y quién es el administrador de contrato.</span></li>
      <li><span><b>El empleado anota el horómetro</b> desde su celular con una foto. Si no hay señal, se guarda y se envía solo al volver.</span></li>
      <li><span><b>La app avisa</b> las revisiones técnicas por vencer, los camiones cerca de su límite de horas y los contratos que hay que renegociar.</span></li>
      <li><span><b>El cliente</b> puede revisar el estado de lo que tiene arrendado.</span></li>
    </ol>
  </div>
  <section class="tarjeta" style="border-color:#128C7E">
    <h2>Registro por WhatsApp (simulación)</h2>
    <p class="sec">El empleado manda la patente y el número por WhatsApp, y queda registrado en la app.</p>
    <button class="btn wsp" onclick="S.rol='empleado';guardar();ir('wsp')">${ic('send')}Probar el chat</button>
  </section>
  <button class="btn" onclick="reiniciar()">Reiniciar datos de ejemplo</button>`;
};
function elegirRol(rol) { S.rol = rol; guardar(); ir(HOME[rol]); }
function reiniciar() { if (confirm('¿Volver a los datos de ejemplo originales? Se pierden los cambios de la demostración.')) { S = crearDemo(); guardar(); render(); toast('Datos de ejemplo reiniciados'); } }

/* ============ Dueño: Inicio ============ */
VISTAS.inicio = () => {
  const cs = S.camiones, arr = cs.filter(c => c.contratoId).length, disp = cs.length - arr;
  const items = itemsAtencion();
  const ks = S.contratos.slice().sort((a, b) => a.termino.localeCompare(b.termino));
  const ocup = cs.length ? Math.round(arr / cs.length * 100) : 0;
  return `
  <div class="fecha-larga">${fechaLarga()}</div>
  <h1>${saludo()}, ${esc(primerNombre(dueno().nombre))}</h1>
  <p>Tienes <b>${cs.length} camiones</b>: ${arr} arrendados y ${disp} disponibles. ${items.length ? `Hay <b>${items.length} temas por revisar</b>.` : 'Todo está al día.'}</p>
  <div class="kpis">
    ${kpi('marca', cs.length, 'Flota total', 'truck', '#flota')}
    ${kpi('', arr, 'Arrendados', 'building', '#flota?f=arrendados')}
    ${kpi('', disp, 'Disponibles', 'check', '#flota?f=disponibles')}
    ${kpi(items.length ? 'urgente' : 'ok', items.length, 'Por revisar', items.length ? 'alert' : 'check', '#avisos')}
  </div>
  <div class="grid-inicio">
    <section class="tarjeta">
      <div class="titulo-tarjeta"><h2>Requiere atención</h2>${items.length ? `<span class="chip urgente">${items.length} por revisar</span>` : ''}</div>
      <p class="sec">Ordenado del más urgente al menos urgente.</p>
      <div>${items.length ? items.map(filaAtencion).join('') : '<div class="vacio">Nada pendiente. Todo al día.</div>'}</div>
    </section>
    <div>
      <section class="tarjeta">
        <div class="titulo-tarjeta"><h2>Contratos</h2><a class="ver-todo" href="#contratos">Ver todos →</a></div>
        ${ks.length ? ks.map(k => { const ec = estadoContrato(k); return `<a class="aviso-fila" href="#contrato/${k.id}"><span class="cuerpo"><b>${esc(k.empresa)}</b><span class="sec">${nCam(camionesDe(k).length)} · hasta ${fecha(dISO(k.termino))}</span><span class="chips">${chip(ec.e, ec.txt)}</span></span>${ic('chevron')}</a>`; }).join('') : '<p class="sec">Sin contratos activos.</p>'}
      </section>
      <section class="tarjeta">
        <h2>Ocupación de la flota</h2>
        <p style="margin:0"><b class="num" style="font-size:1.6rem">${ocup}%</b> <span class="sec">arrendada</span></p>
        <div class="barra marca" role="img" aria-label="${ocup}% de la flota arrendada"><span style="width:${ocup}%"></span></div>
        <p class="sec" style="margin:0">${arr} arrendados · ${disp} disponibles para arriendo</p>
      </section>
    </div>
  </div>`;
};

/* ============ Dueño: Flota ============ */
VISTAS.flota = (_, q) => {
  const f = q.get('f') || 'todos';
  const cs = S.camiones, arr = cs.filter(c => c.contratoId);
  const lista = (f === 'arrendados' ? arr : f === 'disponibles' ? cs.filter(c => !c.contratoId) : cs).slice().sort(ordenUrgencia);
  const tab = (k, t, n) => `<a class="btn chico" href="#flota?f=${k}" aria-pressed="${f === k}">${t} (${n})</a>`;
  return `
  <div class="cab"><div><h1>Flota</h1><p class="sec" style="margin:0">Todos tus camiones, arrendados y disponibles.</p></div>
    <div class="acciones no-print"><a class="btn chico" href="#editar/nuevo">${ic('plus')}Agregar camión</a><button class="btn chico" onclick="exportarCSV()">${ic('download')}Excel</button></div></div>
  <div class="filtros" role="group" aria-label="Filtrar">${tab('todos', 'Todos', cs.length)}${tab('arrendados', 'Arrendados', arr.length)}${tab('disponibles', 'Disponibles', cs.length - arr.length)}</div>
  ${lista.length ? lista.map(filaCamion).join('') : '<div class="tarjeta vacio">No hay camiones en este grupo.</div>'}`;
};

/* ============ Dueño: Detalle de camión ============ */
VISTAS.camion = id => {
  const c = camion(id); if (!c) return VISTAS.flota(null, new URLSearchParams());
  const rt = estadoRT(c), h = estadoHoras(c), sr = sinReporte(c), k = contrato(c.contratoId);
  const ls = lecturasOk(c);
  // horas trabajadas por día en los últimos 14 días
  const dias = []; for (let j = 13; j >= 0; j--) dias.push({ d0: hoy0().getTime() - j * DIA, h: 0 });
  ls.forEach((l, i) => { if (!i) return; const dd = dias.find(x => l.fecha >= x.d0 && l.fecha < x.d0 + DIA); if (dd) dd.h += l.valor - ls[i - 1].valor; });
  const max = Math.max(12, ...dias.map(x => x.h));
  const ec = k && estadoContrato(k);
  return `
  <div class="cab"><div><h1 class="patente">${fmtPatente(c.patente)}</h1><p class="sec" style="margin:0">${esc(c.tipo)} · ${esc(c.modelo)}${c.operador ? ' · Registra: ' + esc(usuario(c.operador).nombre) : ''}</p></div>
    <div class="chips">${chipArriendo(c)}${chip(estadoGeneral(c), ETQ[estadoGeneral(c)])}</div></div>
  ${k ? `<section class="tarjeta borde-${ec.e}">
      <div class="titulo-tarjeta"><h2>Arrendado a ${esc(k.empresa)}</h2>${chip(ec.e, ec.txt)}</div>
      <dl class="dl"><dt>Contrato</dt><dd>${esc(k.numero)}</dd><dt>Vigencia</dt><dd>${fecha(dISO(k.inicio))} al ${fecha(dISO(k.termino))}</dd><dt>Faena</dt><dd>${esc(k.faena)}</dd>
      <dt>Adm. contrato</dt><dd>${esc(k.admin.nombre)}<br><span class="sec">${esc(k.admin.telefono)} · ${esc(k.admin.correo)}</span></dd></dl>
      <div class="acciones"><a class="btn chico pri" href="#contrato/${k.id}">Ver contrato</a><a class="btn chico" href="#ficha/${k.id}">${ic('file')}Ficha</a></div>
    </section>` : `<section class="tarjeta nota">
      <h2>Disponible para arriendo</h2><p class="sec">Este camión no tiene contrato vigente.</p>
      <a class="btn cta" href="#editar-contrato/nuevo?camion=${c.id}">${ic('plus')}Arrendar este camión</a>
    </section>`}
  <div class="grid grid-2">
    <section class="tarjeta borde-${rt.e}">
      <h2>Revisión técnica</h2>
      <p style="margin:0">Vence el <b>${fecha(dISO(c.rtVence))}</b></p>
      <div class="chips" style="margin:.5rem 0 .75rem">${chip(rt.e, rt.txt)}</div>
      <a class="btn chico" href="#" onclick="toast('En la versión real aquí se abre el certificado (PDF o foto).');return false">${ic('file')}Ver certificado</a>
    </section>
    <section class="tarjeta borde-${h.e}">
      <h2>Horómetro</h2>
      <p style="margin:0"><b class="num" style="font-size:1.5rem">${n1(h.actual)} h</b> <span class="sec">de ${n0(c.limite)} h de límite</span></p>
      <div class="barra ${h.e}" role="img" aria-label="${Math.floor(h.pct)}% del límite usado"><span style="width:${Math.min(100, h.pct)}%"></span></div>
      <div class="chips" style="margin-bottom:.5rem">${chip(h.e, h.txt)}</div>
      <p class="sec" style="margin:0">${h.pct >= 100 ? 'Ya superó el límite.' : h.dias != null ? `Usa en promedio <b>${n1(h.prom)} h por día</b>. Le quedan <b>${n0(h.resta)} h</b>: llegaría al límite cerca del <b>${fecha(h.fechaLim)}</b>.` : `Le quedan <b>${n0(h.resta)} h</b>. Sin uso reciente para proyectar.`}</p>
    </section>
  </div>
  ${k ? `<section class="tarjeta">
    <h2>Horas de motor por día</h2>
    <p class="sec" style="margin:0">Últimos 14 días${sr.si ? ` · <b>${sr.dias} días sin reporte</b>` : ''}</p>
    <div class="graf" role="img" aria-label="Gráfico de horas por día, últimos 14 días">${dias.map(x => `<span style="height:${x.h / max * 100}%" title="${fechaCorta(x.d0)}: ${n1(x.h)} h"></span>`).join('')}</div>
    <div class="graf-ejes"><span>${fechaCorta(dias[0].d0)}</span><span>hoy</span></div>
  </section>` : ''}
  <div class="acciones no-print" style="margin-bottom:12px">
    <a class="btn wsp" target="_blank" rel="noopener" href="${linkWsp(mensajeCamion(c))}">${ic('send')}Avisar por WhatsApp</a>
    <a class="btn" href="#editar/${c.id}">${ic('sliders')}Editar datos</a>
  </div>
  <section class="tarjeta">
    <h2>Registros de horómetro</h2>
    <div class="tabla-wrap"><table>
      <thead><tr><th>Fecha</th><th>Lectura</th><th>Foto</th><th>Estado</th></tr></thead>
      <tbody>${ls.slice(-10).reverse().map(l => `<tr>
        <td>${fechaCorta(l.fecha)} ${hora(l.fecha)}<br><span class="sec">${esc(usuario(l.usuario).nombre)}${l.origen === 'whatsapp' ? ' · WhatsApp' : ''}</span></td>
        <td class="num">${n1(l.valor)}</td>
        <td><img class="mini-foto" src="${l.img || fotoEjemplo(l.valor)}" alt="Foto del horómetro: ${n1(l.valor)}"></td>
        <td>${celdaEstado(l, c.id)}</td></tr>`).join('')}</tbody>
    </table></div>
  </section>`;
};
function celdaEstado(l, cid) {
  if (l.estado === 'validado') return chip('ok', 'Validado');
  if (l.estado === 'observado') return chip('urgente', 'Observado') + (l.nota ? `<div class="sec" style="font-size:.85rem">${esc(l.nota)}</div>` : '');
  return chip('porvencer', 'Por validar') + `<div class="acciones" style="gap:6px;margin-top:6px"><button class="btn chico pri" onclick="validar('${cid}','${l.id}',true)">Validar</button><button class="btn chico" onclick="validar('${cid}','${l.id}',false)">Observar</button></div>`;
}
function validar(cid, lid, ok) {
  const l = camion(cid).lecturas.find(x => x.id === lid);
  if (ok) { l.estado = 'validado'; toast('Registro validado'); }
  else { const nota = prompt('¿Qué tiene de malo este registro? (le llegará al empleado)', 'No se lee bien el número en la foto.'); if (nota === null) return; l.estado = 'observado'; l.nota = nota; toast('Registro observado'); }
  guardar(); render();
}

/* ============ Dueño: Contratos ============ */
function tarjetaContrato(k) {
  const ec = estadoContrato(k), cs = camionesDe(k);
  const ini = new Date(dISO(k.inicio)), fin = new Date(dISO(k.termino));
  const avance = Math.max(0, Math.min(100, (Date.now() - ini) / (fin - ini) * 100));
  return `<section class="tarjeta borde-${ec.e}">
    <div class="titulo-tarjeta" style="flex-wrap:wrap"><h2><a class="patente" style="font-size:1.15rem;letter-spacing:0" href="#contrato/${k.id}">${esc(k.empresa)}</a></h2>${chip(ec.e, ec.txt)}</div>
    <p class="sec" style="margin:0">${esc(k.numero)} · ${esc(k.faena)}</p>
    <p style="margin:.5rem 0 0"><b>${fecha(ini)}</b> al <b>${fecha(fin)}</b></p>
    <div class="barra ${ec.e === 'ok' ? 'marca' : ec.e}" role="img" aria-label="${Math.round(avance)}% del plazo transcurrido"><span style="width:${avance}%"></span></div>
    <div class="persona" style="margin:.75rem 0">
      <span class="avatar">${iniciales(k.admin.nombre)}</span>
      <div style="min-width:0"><b>${esc(k.admin.nombre)}</b> <span class="sec">· ${esc(k.admin.cargo)}</span><br><span class="sec" style="overflow-wrap:anywhere">${esc(k.admin.telefono)} · ${esc(k.admin.correo)}</span></div>
    </div>
    ${contactoBotones(k.admin)}
    <div class="chips" style="margin:.75rem 0">${cs.map(c => `<a class="chip arrendado" style="text-decoration:none" href="#camion/${c.id}">${ic('truck')}${fmtPatente(c.patente)}</a>`).join('')}</div>
    <div class="acciones"><a class="btn chico pri" href="#contrato/${k.id}">Ver detalle</a><a class="btn chico" href="#ficha/${k.id}">${ic('file')}Ficha</a></div>
  </section>`;
}
VISTAS.contratos = () => {
  const ks = S.contratos.slice().sort((a, b) => a.termino.localeCompare(b.termino));
  const renegociar = ks.filter(k => estadoContrato(k).e !== 'ok').length;
  return `
  <div class="cab"><div><h1>Contratos de arriendo</h1><p class="sec" style="margin:0">Con quién está cada camión y hasta cuándo.</p></div>
    <a class="btn chico cta no-print" href="#editar-contrato/nuevo">${ic('plus')}Nuevo contrato</a></div>
  <div class="kpis k3">
    ${kpi('marca', ks.length, 'Contratos vigentes', 'file')}

VISTAS['editar-contrato'] = (id, q) => {

function guardarContrato(ev, id) {
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const d = Object.fromEntries(fd); const sel = fd.getAll('camiones');
  if (d.termino <= d.inicio) { toast('La fecha de término debe ser posterior al inicio'); return; }
  if (!sel.length) { toast('Elige al menos un camión'); return; }
  const datos = { empresa: d.empresa.trim(), rut: d.rut.trim(), faena: d.faena.trim(), inicio: d.inicio, termino: d.termino, notas: d.notas.trim(),
    admin: { nombre: d.adminNombre.trim(), cargo: d.adminCargo.trim(), telefono: d.adminTelefono.trim(), correo: d.adminCorreo.trim() } };
  let k;
  if (id === 'nuevo') { k = { id: 'k' + Date.now(), numero: `CT-${new Date().getFullYear()}-${String(S.contratos.length + 30).padStart(3, '0')}`, ...datos }; S.contratos.push(k); }
  else { k = contrato(id); Object.assign(k, datos); }
  S.camiones.forEach(c => { if (sel.includes(c.id)) c.contratoId = k.id; else if (c.contratoId === k.id) c.contratoId = null; });
  guardar(); toast('Contrato guardado'); ir('contrato/' + k.id);
}
function finalizarContrato(id) {
  const k = contrato(id);
  if (!confirm(`¿Finalizar el contrato con ${k.empresa}? Sus camiones quedarán disponibles para arriendo.`)) return;
  S.camiones.forEach(c => { if (c.contratoId === id) c.contratoId = null; });
  S.contratos = S.contratos.filter(x => x.id !== id);
  S.usuarios.forEach(u => { if (u.contratoId === id) u.activo = false; });
  guardar(); toast('Contrato finalizado'); ir('contratos');
}

/* Reglas del horómetro (las usan la app y el chat de WhatsApp): devuelve el error o '' si está bien */
function validarLectura(c, v) {
  const u = ultima(c, true);
  if (isNaN(v) || v <= 0) return 'Escribe el número del horómetro, solo con números.';
  if (u && v < u.valor) return `El número es menor que la última vez (${n1(u.valor)} h). El horómetro nunca baja: revisa que esté bien escrito.`;
  if (u) {
    const pasaron = (Date.now() - u.fecha) / 3600000;
    if (v - u.valor > pasaron + 0.5) return `Son ${n1(v - u.valor)} horas más que la última vez, pero desde entonces solo han pasado ${n1(pasaron)} horas. Revisa el número.`;
  }
  return '';
}
// "7.450" o "7 450" = 7450; "7450,5" o "7450.5" = 7450,5
function leerNumero(txt) {
  let s = String(txt).trim().replace(/\s/g, '');
  if (/^\d+\.\d$/.test(s)) return Number(s);
  return Number(s.replace(/\./g, '').replace(',', '.'));
}
function paso1(id) {
  const c = camion(id);
  REG.valor = $('#lect').value;
  REG.error = $('#lect').value.trim() ? validarLectura(c, leerNumero(REG.valor)) : 'Escribe el número del horómetro, solo con números.';
  if (!REG.error) { REG.valor = leerNumero(REG.valor); REG.paso = 2; }
  render();
}
function achicarFoto(f, listo) { // se achica para no llenar la memoria del celular
  const img = new Image(); const url = URL.createObjectURL(f);
  img.onload = () => {
    const k = Math.min(1, 640 / Math.max(img.width, img.height));
    const cv = document.createElement('canvas'); cv.width = img.width * k; cv.height = img.height * k;
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url); listo(cv.toDataURL('image/jpeg', 0.7));
  };
  img.src = url;
}
function cargarFoto(inp) {
  const f = inp.files[0]; if (!f) return;
  achicarFoto(f, foto => { REG.foto = foto; REG.error = ''; render(); });
}
function paso2() { if (!REG.foto) { REG.error = 'Falta la foto. Toca "Tomar foto".'; render(); return; } REG.error = ''; REG.paso = 3; render(); }
function guardarRegistro() {
  const c = camion(REG.id);
  const offline = !enLinea();
  c.lecturas.push({ id: 'l' + Date.now(), fecha: Date.now(), valor: REG.valor, usuario: EMP_ID, foto: true, img: REG.foto.length < 120000 ? REG.foto : null, estado: 'pendiente', sync: offline ? 'cola' : 'enviado' });
  guardar(); REG.done = true; REG.offline = offline; render();
}

let CHAT_TECLADO = false; // solo se vuelve a enfocar el campo si la persona escribió (en celular no abre el teclado por sorpresa)
const misCamiones = () => S.camiones.filter(c => c.operador === EMP_ID);
const sugerido = c => { const u = ultima(c, true); const pasaron = u ? (Date.now() - u.fecha) / 3600000 : 8; return Math.floor((u ? u.valor : 0) + Math.min(8, Math.max(1, pasaron - 1))); };

}
function chatEstado() {

VISTAS.wsp = () => {
  const ch = chatEstado(), cs = misCamiones(), c = cs[0];
  const sug = c ? [`${c.patente} ${sugerido(c)}`, '📷 Foto de ejemplo', 'Hola', `${c.patente} ${Math.max(1, Math.floor(ultima(c, true).valor) - 100)}`] : ['Hola'];
  return `
  <div class="cab"><div><h1>Registro por WhatsApp</h1><p class="sec" style="margin:0">Simulación: así le escribiría <b>${esc(usuario(EMP_ID).nombre)}</b> al número de WhatsApp de la empresa.</p></div>
    ${S.rol === 'dueno' ? `<a class="btn chico no-print" href="#horometros">Ver en Horómetros →</a>` : ''}</div>
  <div class="chat">
    <div class="chat-cab"><span class="avatar">${ic('truck')}</span><div><b>${esc(S.config.empresa)} · Horómetros</b><small>Cuenta de empresa · responde al instante</small></div></div>
    <div class="chat-msgs" id="chatMsgs" aria-live="polite">
      <span class="msg-dia">Hoy</span>
      ${ch.msgs.map(m => `<div class="msg ${m.de}">${m.img ? `<img src="${m.img}" alt="Foto del horómetro">` : ''}${m.txt ? esc(m.txt).replace(/\*([^*\n]+)\*/g, '<b>$1</b>') : ''}<span class="t">${hora(m.t)}${m.de === 'yo' ? ' ✓✓' : ''}</span></div>`).join('')}
    </div>
    <div class="chat-sug" aria-label="Mensajes de ejemplo">${sug.map(s => `<button type="button" onclick="chatSugerencia(this.textContent)">${esc(s)}</button>`).join('')}</div>
    <form class="chat-input" onsubmit="chatEnviar(event)">
      <label class="redondo" title="Enviar foto">${ic('camera')}<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Enviar foto</span><input type="file" accept="image/*" capture="environment" hidden onchange="chatFoto(this)"></label>
      <input type="text" id="chatTxt" placeholder="Escribe un mensaje" autocomplete="off" aria-label="Mensaje">
      <button class="redondo enviar" aria-label="Enviar">${ic('send')}</button>
    </form>
  </div>
  <div class="acciones no-print" style="justify-content:center;margin-top:12px"><button class="btn chico" onclick="S.chat=null;guardar();render()">Borrar conversación</button></div>
  <section class="tarjeta nota" style="max-width:520px;margin:12px auto 0">
    <h2>Qué entiende el bot</h2>
    <ul style="margin:0;padding-left:1.2rem">
      <li><b>Patente + número</b>: "KDLP21 7450", "KD-LP-21 7.450" o "kdlp21 7450,5".</li>
      <li><b>Solo la patente</b>: pregunta cuánto marca.</li>
      <li><b>Una foto</b>: la guarda como respaldo del registro.</li>
      <li>Aplica las mismas reglas que la app: el número no puede bajar ni subir más horas de las que pasaron.</li>
    </ul>
  </section>`;
};
function chatSugerencia(txt) {
  CHAT_TECLADO = false;
  if (txt.startsWith('📷')) { const c = misCamiones()[0]; chatRecibir('', fotoEjemplo(c ? sugerido(c) : 0)); return; }
  chatRecibir(txt);
}
function chatEnviar(ev) { ev.preventDefault(); const t = $('#chatTxt').value.trim(); if (t) { CHAT_TECLADO = true; chatRecibir(t); } }
function chatFoto(inp) { CHAT_TECLADO = false; const f = inp.files[0]; if (f) achicarFoto(f, foto => chatRecibir('', foto)); }
function chatRecibir(txt, img) {
  const ch = chatEstado();
  ch.msgs.push({ de: 'yo', txt, img: img && img.length < 120000 ? img : (img ? fotoEjemplo(0) : null), t: Date.now() });
  guardar(); render();
  setTimeout(() => { ch.msgs.push({ de: 'bot', txt: chatResponder(txt, img), t: Date.now() }); guardar(); if (leerRuta().r === 'wsp') render(); }, 600);
}
function chatResponder(txt, img) {
  const ch = S.chat, ctx = ch.ctx, cs = misCamiones();
  const lista = cs.map(x => fmtPatente(x.patente)).join(', ');
  if (img && !txt) {
    // foto sola: respalda el último registro hecho por chat (si fue hace menos de 30 min) o queda esperando los datos
    const cu = ctx.ultimo && camion(ctx.ultimo.cid);
    const r = cu && cu.lecturas.find(l => l.id === ctx.ultimo.lid);
    if (r && Date.now() - r.fecha < 30 * 60000) {
      r.img = img.length < 120000 ? img : null; r.foto = true; ch.ctx = {}; guardar();
      return `📷 Foto guardada como respaldo del registro de ${fmtPatente(cu.patente)} (${n1(r.valor)} h). ¡Gracias!`;
    }
    ctx.foto = img.length < 120000 ? img : null;
    return 'Recibí la foto 👍\n¿De qué camión y cuánto marca? Escribe la patente y el número, por ejemplo:\n' + (cs[0] ? `${cs[0].patente} ${sugerido(cs[0])}` : 'KDLP21 7450');
  }
  const T = txt.toUpperCase();
  if (/^(HOLA|AYUDA|MENU|MENÚ|INICIO|BUENAS|BUENOS)/.test(T.trim())) return chatAyuda();
  // patente: 2 letras + 2 letras/números + 2 números, con o sin separadores
  const mp = T.match(/\b([A-Z]{2})[\s·.\-]?([A-Z0-9]{2})[\s·.\-]?(\d{2})\b/);
  const resto = mp ? T.replace(mp[0], ' ') : T;
  const mn = resto.match(/\d[\d.\s]*(?:,\d+)?/);
  let c = null;
  if (mp) {
    const pat = mp[1] + mp[2] + mp[3];
    c = cs.find(x => x.patente === pat);
    if (!c) return `No encuentro el camión ${fmtPatente(pat)} entre tus camiones asignados.\nTus camiones son: ${lista || 'ninguno'}.\nSi es un error, avísale a la oficina.`;
  } else if (ctx.cid && mn) c = camion(ctx.cid); // respondió solo el número a la pregunta anterior
  if (!c) {
    if (mn && cs.length === 1) c = cs[0];
    else return `No entendí de qué camión es 🤔\nEscribe la patente y el número, por ejemplo:\n${cs[0] ? `${cs[0].patente} ${sugerido(cs[0])}` : 'KDLP21 7450'}`;
  }
  if (!mn) { ctx.cid = c.id; guardar(); return `¿Cuánto marca el horómetro de ${fmtPatente(c.patente)}? Escribe solo el número.`; }
  const v = leerNumero(mn[0]);
  const err = validarLectura(c, v);
  if (err) { ctx.cid = c.id; guardar(); return `⚠️ ${err}\nEscribe el número de nuevo.`; }
  const u = ultima(c, true);
  const foto = img || ctx.foto || null;
  const l = { id: 'l' + Date.now(), fecha: Date.now(), valor: v, usuario: EMP_ID, foto: !!foto, img: foto && foto.length < 120000 ? foto : null, estado: 'pendiente', sync: 'enviado', origen: 'whatsapp' };
  c.lecturas.push(l);
  ch.ctx = foto ? {} : { ultimo: { cid: c.id, lid: l.id } };
  guardar();
  return `✅ *Registrado*\n${fmtPatente(c.patente)} · ${n1(v)} h\n${u ? `+${n1(v - u.valor)} h desde ${cuando(u.fecha)}.` : 'Primer registro.'}\n${foto ? '📷 Foto guardada como respaldo.' : 'Si puedes, manda una foto del horómetro como respaldo.'}\n¡Gracias, ${primerNombre(usuario(EMP_ID).nombre)}!`;
}

/* ============ Cliente (empresa que arrienda) ============ */
const CLI_ID = 'u3';
VISTAS.cliente = () => {
  const u = usuario(CLI_ID), k = contrato(u.contratoId);
  if (!k || !u.activo) return `<h1>Hola, ${esc(primerNombre(u.nombre))}</h1><div class="tarjeta vacio">No tienes camiones arrendados por ahora.</div>`;
  const ec = estadoContrato(k), cs = camionesDe(k);
  return `
  <div class="fecha-larga">${esc(k.empresa)}</div>
  <h1>Hola, ${esc(primerNombre(u.nombre))}</h1>
  <p class="sec">Aquí ves los camiones que arriendas a ${esc(S.config.empresa)}.</p>
  <section class="tarjeta borde-${ec.e}">
    <div class="titulo-tarjeta"><h2>Tu contrato</h2>${chip(ec.e, ec.txt)}</div>
    <dl class="dl" style="margin:0"><dt>Contrato</dt><dd>${esc(k.numero)}</dd><dt>Vigencia</dt><dd>${fecha(dISO(k.inicio))} al ${fecha(dISO(k.termino))}</dd><dt>Camiones</dt><dd>${cs.length}</dd></dl>
  </section>
  ${cs.map(c => { const rt = estadoRT(c), h = estadoHoras(c), ul = ultima(c); return `<section class="tarjeta">
    <div class="fila entre"><span class="patente">${fmtPatente(c.patente)}</span><span class="sec">${esc(c.tipo)}</span></div>
    <dl class="dl" style="margin-top:.5rem"><dt>Rev. técnica</dt><dd>${fecha(dISO(c.rtVence))}</dd><dt>Horómetro</dt><dd>${n1(h.actual)} h <span class="sec">de ${n0(c.limite)} h</span></dd><dt>Último registro</dt><dd>${ul ? cuando(ul.fecha) : '—'}</dd></dl>
    <div class="barra ${h.e}"><span style="width:${Math.min(100, h.pct)}%"></span></div>
    <div class="chips">${chip(rt.e, 'Rev. técnica: ' + rt.txt)}${chip(h.e, 'Horas: ' + h.txt)}</div>
  </section>`; }).join('')}
  <section class="tarjeta nota">
    <h2>¿Necesitas algo?</h2>
    <p>Tu contacto en ${esc(S.config.empresa)}: <b>${esc(dueno().nombre)}</b> · ${esc(S.config.telefono)}</p>
    ${contactoBotones({ telefono: S.config.telefono, correo: S.config.correo })}
  </section>
  <p class="sec">Vista de solo lectura. Lo que ve el cliente se definirá en detalle más adelante.</p>`;
};

/* ============ Reporte Excel (CSV) ============ */
function exportarCSV() {
  const cab = ['Patente', 'Tipo', 'Modelo', 'Estado arriendo', 'Empresa', 'Contrato vence', 'Horómetro actual', 'Límite horas', '% usado', 'Promedio h/día', 'Fecha límite aprox.', 'Vence rev. técnica', 'Días restantes RT', 'Último reporte', 'Estado'];
  const filas = S.camiones.slice().sort(ordenUrgencia).map(c => {
    const h = estadoHoras(c), rt = estadoRT(c), u = ultima(c), k = contrato(c.contratoId);
    return [fmtPatente(c.patente), c.tipo, c.modelo, k ? 'Arrendado' : 'Disponible', k ? k.empresa : '', k ? fecha(dISO(k.termino)) : '', n1(h.actual), c.limite, Math.floor(h.pct), n1(h.prom), h.fechaLim ? fecha(h.fechaLim) : '', fecha(dISO(c.rtVence)), rt.d, u ? fecha(u.fecha) : '', ETQ[estadoGeneral(c)]];
  });
  const csv = '﻿' + [cab, ...filas].map(f => f.map(x => `"${String(x).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `flota-${fecha(Date.now()).replace(/\//g, '-')}.csv`; a.click();
  toast('Reporte descargado');
}

render();
